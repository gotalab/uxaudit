        if (items.length === 0) return;
        const block = el('div', { class: 'subtype-block' });
        const blockHead = el('div', { class: 'subtype-block-head' });
        // Primary: user-subject sentence form (e.g. "Can users decide?")
        blockHead.appendChild(el('span', { class: 'subtype-name' }, [t(st.shortKey)]));
        // Failing count (trailing)
        blockHead.appendChild(el('span', { class: 'subtype-count' }, [t('action.failingCount', { n: items.length })]));
        block.appendChild(blockHead);
        items.forEach(c => block.appendChild(renderFailCard(c, fixIndex)));
        sec.appendChild(block);
      });
      allBody.appendChild(sec);
    }

    if (riskFailures.length > 0) {
      const sec = el('section', { class: 'action-section' });
      const head = el('div', { class: 'section-head risk' });
      head.appendChild(iconEl('spark'));
      head.appendChild(document.createTextNode(t('action.uiRisk')));
      const issuesText = riskFailures.length === 1 ? t('action.issuesOne') : t('action.issuesMany', { n: riskFailures.length });
      head.appendChild(el('span', { class: 'badge' }, [issuesText]));
      head.appendChild(el('span', { class: 'head-tag' }, [t('action.sortedBySeverity')]));
      sec.appendChild(head);

      sortBySeverity(riskFailures).forEach(c => sec.appendChild(renderFailCard(c, fixIndex)));
      allBody.appendChild(sec);
    }

    allDet.appendChild(allBody);
    mainCol.appendChild(allDet);
  } else if (failed === 0 && total > 0) {
    const sec = el('section', { class: 'action-section' });
    const head = el('div', { class: 'section-head' });
    head.appendChild(iconEl('check'));
    head.appendChild(document.createTextNode(t('action.none')));
    head.appendChild(el('span', { class: 'badge' }, [t('action.nonePassing', { n: passed })]));
    sec.appendChild(head);
    sec.appendChild(el('p', { style: 'font-size:13px;color:var(--fg-2);max-width:60ch;line-height:1.6;margin-top:8px;' },
      [t('action.noneBody')]));
    mainCol.appendChild(sec);
  }

  // ─── L4: PASSING (collapsed) ──
  const passing = checks.filter(c => c.result === 'pass');
  if (passing.length > 0) {
    const det = document.createElement('details');
    det.className = 'collap';
    const sum = document.createElement('summary');
    const chev = document.createElement('span');
    chev.className = 'chev icon';
    chev.innerHTML = svgIcon('chevronR');
    sum.appendChild(chev);
    sum.appendChild(document.createTextNode(t('sec.passing')));
    sum.appendChild(el('span', { class: 'badge' }, [String(passing.length)]));
    det.appendChild(sum);
    const body = el('div', { class: 'collap-body' });
    renderSecondaryGroups(body, passing, 'pass');
    det.appendChild(body);
    mainCol.appendChild(det);
  }

  // ─── L4: UNVERIFIABLE (audit integrity — collapsed) ──
  // These are checks that ran but couldn't commit to a verdict because
  // the audit pipeline ran out of evidence (typically: L4 capture broke at
  // a Compiler-selector mismatch). They live here, NOT in the fail bucket,
  // so the dashboard never lies about app quality. The collapsible label
  // explains what they are so the reader doesn't conflate them with skips.
  const unverifiableItems = checks.filter(c => c.result === 'unverifiable');
  if (unverifiableItems.length > 0) {
    const det = document.createElement('details');
    det.className = 'collap';
    const sum = document.createElement('summary');
    const chev = document.createElement('span');
    chev.className = 'chev icon';
    chev.innerHTML = svgIcon('chevronR');
    sum.appendChild(chev);
    sum.appendChild(document.createTextNode(t('sec.unverifiable')));
    sum.appendChild(el('span', { class: 'badge' }, [String(unverifiableItems.length)]));
    det.appendChild(sum);
    const body = el('div', { class: 'collap-body' });
    const note = el('p', { class: 'collap-note' }, [t('sec.unverifiableNote')]);
    body.appendChild(note);
    renderSecondaryGroups(body, unverifiableItems, 'skipped');
    det.appendChild(body);
    mainCol.appendChild(det);
  }

  // ─── L4: SKIPPED (collapsed) ──
  const skippedItems = checks.filter(c => c.result === 'skipped');
  if (skippedItems.length > 0) {
    const det = document.createElement('details');
    det.className = 'collap';
    const sum = document.createElement('summary');
    const chev = document.createElement('span');
    chev.className = 'chev icon';
    chev.innerHTML = svgIcon('chevronR');
    sum.appendChild(chev);
    sum.appendChild(document.createTextNode(t('sec.skipped')));
    sum.appendChild(el('span', { class: 'badge' }, [String(skippedItems.length)]));
    det.appendChild(sum);
    const body = el('div', { class: 'collap-body' });
    renderSecondaryGroups(body, skippedItems, 'skipped');
    det.appendChild(body);
    mainCol.appendChild(det);
  }

  // ─── ASIDE: sticky screenshot panel + meta ──
  // Replaces the old peripheral .context-strip block. Stays pinned on the
  // right while the user scrolls through suggested fixes / all issues.
  if (iter.screenshot_data_uri) {
    const card = el('div', { class: 'aside-card' });

    // Clickable screenshot — opens the lightbox at full resolution
    const shotBtn = el('button', { type: 'button', class: 'aside-shot', 'aria-label': 'Open captured target' });
    shotBtn.appendChild(el('img', { src: iter.screenshot_data_uri, alt: app.name || 'captured target' }));
    shotBtn.addEventListener('click', () => {
      openLightbox(
        [{ name: 'captured-target.png', data_uri: iter.screenshot_data_uri }],
        0,
        app.name || 'captured target'
      );
    });
    card.appendChild(shotBtn);

    const meta = el('div', { class: 'aside-meta' });
    meta.appendChild(el('h3', null, [t('context.title')]));
    const dl = el('dl');
    if (app.url) {
      dl.appendChild(el('dt', null, [t('context.url')]));
      const ddu = el('dd');
      ddu.appendChild(el('a', { href: app.url, target: '_blank' }, [app.url]));
      dl.appendChild(ddu);
    }
    if (dateStr) {
      dl.appendChild(el('dt', null, [t('context.captured')]));
      dl.appendChild(el('dd', null, [dateStr]));
    }
    dl.appendChild(el('dt', null, [t('context.iteration')]));
    dl.appendChild(el('dd', null, [iter.label || ('iteration ' + iter.iteration)]));
    meta.appendChild(dl);

    // Totals as colored pills (replaces the old wordy "X (Y pass · Z fail · W skip)" line)
    const totals = el('div', { class: 'totals' });
    totals.appendChild(el('span', { class: 'pill pass' }, [`${passed} pass`]));
    if (failed > 0) totals.appendChild(el('span', { class: 'pill fail' }, [`${failed} fail`]));
    if (skipped > 0) totals.appendChild(el('span', { class: 'pill skip' }, [`${skipped} skip`]));
    meta.appendChild(totals);

    card.appendChild(meta);
    aside.appendChild(card);
  }

}

/* ─── UX subtype model ─────────────────────────────────── */
const UX_SUBTYPE_ORDER = [
  { key: 'understand', shortKey: 'uxsub.understand.short', longKey: 'uxsub.understand.long' },
  { key: 'decide',     shortKey: 'uxsub.decide.short',     longKey: 'uxsub.decide.long' },
  { key: 'act',        shortKey: 'uxsub.act.short',        longKey: 'uxsub.act.long' },
  { key: 'recover',    shortKey: 'uxsub.recover.short',    longKey: 'uxsub.recover.long' },
];

/* ─── helpers for new audit body ──────────────────────── */

function logicalBand(check) {
  return check.band === 'ui-risk' ? 'ui-risk' : 'ux';
}

function computeBandStats(checks) {
  const stats = {};
  for (const c of checks) {
    const b = logicalBand(c);
    const s = stats[b] ||= { total: 0, passed: 0, failed: 0, skipped: 0, unverifiable: 0 };
    s.total++;
    if (c.result === 'pass') s.passed++;
    else if (c.result === 'unverifiable') s.unverifiable++;
    else if (c.result === 'fail' || c.result === 'error') s.failed++;
    else if (c.result === 'skipped') s.skipped++;
  }
  return stats;
}

function logicalUxSubtype(check) {
  if (logicalBand(check) !== 'ux') return null;
  return check.subtype || null;
}

function groupUxFailuresBySubtype(failures) {
  const groups = {};
  for (const c of failures) {
    const st = logicalUxSubtype(c) || 'act';
    (groups[st] ||= []).push(c);
  }
  for (const k of Object.keys(groups)) groups[k] = sortBySeverity(groups[k]);
  return groups;
}

function methodLabel(check) {
  return t(`method.${check.method}.short`) || check.method || '';
}

function compactSummary(check, kind) {
  const details = (check.evidence?.details || '').replace(/\s+/g, ' ').trim();
  if (kind === 'skipped') return details;
  if (details) {
    const sentences = details.match(/[^.!?。！？]+[.!?。！？]?/g) || [details];
    const summary = sentences.slice(0, 2).join(' ').trim();
    if (summary && summary.length < details.length) return summary;
    return details.slice(0, 180).trim();
  }
  const first = check.evidence?.matches?.[0]?.matched_text || '';
  return first.replace(/\s+/g, ' ').trim();
}

function hasExpandableDetail(check, kind) {
  if (kind === 'skipped') return false;
  const details = (check.evidence?.details || '').replace(/\s+/g, ' ').trim();
  const summary = compactSummary(check, kind);
  return Boolean((details && details.length > summary.length) || (check.evidence?.matches || []).length > 0);
}

function metaPill(text, cls='') {
  return el('span', { class: `meta-pill ${cls}`.trim() }, [text]);
}

function buildMetaPills(check) {
  const pills = [];
  const band = logicalBand(check);
  pills.push(metaPill(t(`band.${band}.short`) || band, `band-${band}`));
  const subtype = logicalUxSubtype(check);
  if (subtype) pills.push(metaPill(t(`uxsub.${subtype}.pill`) || subtype, 'subtype'));
  pills.push(metaPill(methodLabel(check), 'method'));
  return pills;
}

function renderCompactGroup(name, desc, items, kind) {
  const wrap = el('div', { class: 'compact-group' });
  const head = el('div', { class: 'compact-group-head' });
  head.appendChild(el('span', { class: 'name' }, [name]));
  if (desc) head.appendChild(el('span', { class: 'desc' }, [desc]));
  head.appendChild(el('span', { class: 'count' }, [String(items.length)]));
  wrap.appendChild(head);
  items.forEach(c => wrap.appendChild(renderCompactRow(c, kind)));
  return wrap;
}

function renderSecondaryGroups(body, items, kind) {
  const uxItems = items.filter(c => logicalBand(c) === 'ux');
  const riskItems = items.filter(c => logicalBand(c) === 'ui-risk');

  if (uxItems.length > 0) {
    const bandWrap = el('div', { class: 'compact-group' });
    const bandHead = el('div', { class: 'compact-group-head' });
    bandHead.appendChild(el('span', { class: 'name' }, [t('band.ux.short')]));
    bandHead.appendChild(el('span', { class: 'desc' }, [t('band.ux.long')]));
    bandHead.appendChild(el('span', { class: 'count' }, [String(uxItems.length)]));
    bandWrap.appendChild(bandHead);
    for (const st of UX_SUBTYPE_ORDER) {
      const group = uxItems.filter(c => logicalUxSubtype(c) === st.key);
      if (group.length === 0) continue;
      bandWrap.appendChild(renderCompactGroup(
        t(`uxsub.${st.key}.pill`),
        t(st.shortKey),
        group,
        kind,
      ));
    }
    body.appendChild(bandWrap);
  }

  if (riskItems.length > 0) {
    body.appendChild(renderCompactGroup(
      t('band.ui-risk.short'),
      t('band.ui-risk.long'),
      riskItems,
      kind,
    ));
  }
}

function sortBySeverity(items) {
  const sevOrder = { critical: 0, major: 1, minor: 2 };
  return items.slice().sort((a, b) => (sevOrder[a.severity] ?? 3) - (sevOrder[b.severity] ?? 3));
}

/* L4 journey_evaluation block — renders the 4-axis sub-verdicts (value
   delivery / task completion / operating cost / feedback quality) on a fail
   card whose result.json carries a journey_evaluation object. Returns null
   if the check has no journey_evaluation, so the caller can skip appending.

   The 4 axes are mapped to ISO 9241-11 + Norman + Cooper. Each axis shows
   verdict + evidence inline; operating_cost additionally shows step counts
   and an expandable per-step excise breakdown. See:
     references/subagents/judge-output-format.md (envelope contract)
     checks/core-experience/primary-journey/prompt.md (per-axis rubric)
     scripts/validate_results.py (rollup invariant enforcement) */
function renderJourneyEvaluation(c) {
  const je = c && c.journey_evaluation;
  if (!je || typeof je !== 'object') return null;

  const wrap = el('div', { class: 'fc-journey-eval' });
  const head = el('div', { class: 'fje-head' });
  head.appendChild(el('span', { class: 'fje-label' }, [t('jeval.title')]));
  head.appendChild(el('span', { class: 'fje-sub' }, [t('jeval.subtitle')]));
  wrap.appendChild(head);

  // Axis order is fixed (ISO 9241-11 effectiveness/efficiency/satisfaction
  // grouping): the two effectiveness axes first, then efficiency, then
  // the satisfaction proxy. Matches the schema and the Judge prompt order.
  const AXES = ['value_delivery', 'task_completion', 'operating_cost', 'feedback_quality'];
  AXES.forEach(axisKey => {
    const axisObj = je[axisKey];
    if (!axisObj || typeof axisObj !== 'object') return;
    const verdict = String(axisObj.verdict || 'skipped');
    const axis = el('div', { class: 'fje-axis' });
    axis.appendChild(el('div', { class: 'fje-axis-name' }, [t('jeval.' + axisKey)]));
    axis.appendChild(el('div', { class: 'fje-axis-verdict ' + verdict },
      [t('jeval.verdict.' + verdict)]));

    const evidence = String(axisObj.evidence || '');
    if (evidence) {
      axis.appendChild(el('div', { class: 'fje-axis-evidence' }, [evidence]));
    }

    // operating_cost has additional step-count stats and an excise breakdown.
    // Stats are always visible; the per-step list is collapsed by default
    // because it can run 5–10 entries on a bad journey and dominates the card.
    if (axisKey === 'operating_cost') {
      const stats = el('div', { class: 'fje-cost-stats' });
      if (typeof axisObj.actual_steps === 'number') {
        stats.appendChild(el('span', { class: 'fje-stat' },
          [t('jeval.actualSteps', { n: axisObj.actual_steps })]));
      }
      if (typeof axisObj.intentional_steps === 'number' && axisObj.intentional_steps > 0) {
        stats.appendChild(el('span', { class: 'fje-stat intentional' },
          [t('jeval.intentionalSteps', { n: axisObj.intentional_steps })]));
      }
      if (typeof axisObj.unintentional_excess === 'number' && axisObj.unintentional_excess > 0) {
        stats.appendChild(el('span', { class: 'fje-stat bad' },
          [t('jeval.unintentionalExcess', { n: axisObj.unintentional_excess })]));
      }
      if (stats.children.length > 0) axis.appendChild(stats);

      const attrib = Array.isArray(axisObj.excise_attribution) ? axisObj.excise_attribution : [];
      if (attrib.length > 0) {
        const toggle = el('button', { class: 'fje-excise-toggle', type: 'button' });
        toggle.appendChild(iconEl('chevronR'));
        const toggleLabel = document.createTextNode(t('jeval.excise.show'));
        toggle.appendChild(toggleLabel);
        const list = el('div', { class: 'fje-excise-list' });
        const ol = el('ol');
        attrib.forEach(entry => {
          if (!entry || typeof entry !== 'object') return;
          const stepNum = (typeof entry.step === 'number') ? entry.step : '?';
          const kind = String(entry.kind || 'unintentional');
          const rationale = String(entry.rationale || '');
          const li = el('li');
          li.appendChild(el('span', { class: 'fje-step-num' },
            [t('jeval.excise.step', { n: stepNum })]));
          li.appendChild(el('span', { class: 'fje-kind ' + kind },
            [t('jeval.excise.' + kind)]));
          li.appendChild(el('span', { class: 'fje-rationale' }, [rationale]));
          ol.appendChild(li);
        });
        list.appendChild(ol);
        toggle.addEventListener('click', () => {
          const opened = list.classList.toggle('open');
          toggleLabel.nodeValue = opened ? t('jeval.excise.hide') : t('jeval.excise.show');
        });
        axis.appendChild(toggle);
        axis.appendChild(list);
      }
    }

    wrap.appendChild(axis);
  });

  return wrap;
}

function renderFailCard(c, fixIndex) {
  const sev = c.severity || 'minor';
  // Anchor id so proposal addresses_fails chips can deep-link straight to
  // this card (and the back-link badge below can chain back to the proposal).
  const failDomId = safeFailDomId(c.check_id);
  const card = el('article', {
    class: `fail-card ${sev}`,
    ...(failDomId ? { id: failDomId } : {}),
  });

  // Fix-queue checkbox (top-right, absolute positioned)
  const qkey = `fail:${c.check_id || c.name || Math.random()}`;
  card.appendChild(queueCheckbox(qkey, {
    kind: 'fail',
    data: c,
    label: c.name || c.check_id || 'Unnamed issue',
  }));

  const top = el('div', { class: 'fc-top' });
  top.appendChild(el('div', { class: 'fc-sev' }, [sev]));
  const title = el('div', { class: 'fc-title' });
  const nameRow = el('div', { class: 'fc-name' });
  nameRow.appendChild(document.createTextNode(c.name || c.check_id));
  // Reverse link: small badge pointing back at the proposal that addresses
  // this fail. Closes the loop in the other direction so the reader sees
  // "this is being handled by Proposal #2" right next to the fail name.
  if (fixIndex && c.check_id) {
    const ref = fixIndex.proposalByCheckId[c.check_id];
    if (ref && typeof ref.rank === 'number') {
      const link = el('a', {
        class: 'fc-proposal-link',
        href: '#' + safeProposalDomId(ref.rank),
        title: t('fixes.fixToProposalTitle', { rank: ref.rank, title: ref.title || '' }),
      }, [t('fixes.fixToProposalBadge', { rank: ref.rank })]);
      link.addEventListener('click', (e) => flashTarget(safeProposalDomId(ref.rank), e));
      nameRow.appendChild(link);
    }
  }
  title.appendChild(nameRow);
  title.appendChild(el('div', { class: 'fc-id' }, [c.check_id || '']));
  top.appendChild(title);
  const meta = el('div', { class: 'fc-meta' });
  buildMetaPills(c).forEach(p => meta.appendChild(p));
  top.appendChild(meta);
  card.appendChild(top);

  // verdict (always visible)
  const v = c.evidence?.details || '';
  if (v) card.appendChild(el('div', { class: 'fc-verdict' }, [v]));

  // L4 journey_evaluation block — only present on primary-journey fail
  // cards. Sits between the prose verdict and the suggestion so the
  // structured 4-axis breakdown is visible without expanding evidence.
  const jeBlock = renderJourneyEvaluation(c);
  if (jeBlock) card.appendChild(jeBlock);

  // suggestion (always visible)
  if (c.suggestion) {
    const fix = el('div', { class: 'fc-fix' });
    fix.appendChild(iconEl('bulb'));
    const body = el('div', { class: 'fc-fix-body' });
    body.appendChild(el('strong', null, [t('fc.howToFix')]));
    body.appendChild(document.createTextNode(c.suggestion));
    fix.appendChild(body);
    card.appendChild(fix);
  }

  // toggle for evidence (collapsed by default)
  const toggle = el('button', { class: 'fc-toggle', type: 'button' });
  toggle.appendChild(iconEl('chevronR'));
  toggle.appendChild(document.createTextNode(t('fc.showEvidence')));
  card.appendChild(toggle);

  const ev = el('div', { class: 'fc-evidence' });
  const dl = el('dl');
  // `c.source` (the ISO/Nielsen/Cooper citation) is intentionally omitted
  // from the card — it's academic filler for a dev fixing the issue. The
  // fix prompt benefits from `pass_criteria` (what has to be true after
  // the fix) and `rationale` (why the user cares); those stay.
  if (c.pass_criteria) { dl.appendChild(el('dt', null, [t('fc.passCriterion')])); dl.appendChild(el('dd', null, [c.pass_criteria])); }
  if (c.rationale) { dl.appendChild(el('dt', null, [t('fc.whyMatters')])); dl.appendChild(el('dd', null, [c.rationale])); }
  if (dl.children.length > 0) ev.appendChild(dl);

  const matches = c.evidence?.matches || [];
  if (matches.length > 0) {
    const m = el('div', { class: 'fc-matches' });
    matches.forEach(mt => {
      const row = el('div', { class: 'm-row' });
      const tag = mt.pattern || mt.type || mt.label || mt.id || 'match';
      row.appendChild(el('span', { class: 'm-tag' }, [tag]));
      const text = mt.matched_text || mt.help || mt.description || JSON.stringify(mt);
      row.appendChild(document.createTextNode(text));
      m.appendChild(row);
    });
    ev.appendChild(m);
  }

  // visual evidence — screenshots / waypoint thumbnails / videos
  const visualEv = renderVisualEvidence(c);
  if (visualEv) ev.appendChild(visualEv);

  card.appendChild(ev);

  toggle.addEventListener('click', () => card.classList.toggle('open'));
  return card;
}

/* Effective evidence file list for a check. Normally this is the check's own
 * embedded_files (populated by generate_dashboard.py from evidence/ files the
 * Judge wrote). For L3-vision checks that don't carry their own files — the
 * common case, since L3 Judges share a single target screenshot and only drop
 * crops "when it materially helps" per the universal contract — we fall back
 * to the iteration's shared target screenshot so the L3 card is no longer
 * disconnected from the image the Judge actually evaluated. The fallback is
 * scoped to L3-vision on purpose: L1/L2 detectors and ui-risk static checks
 * have nothing to do with the screenshot and attaching it would mislead. */
function effectiveEmbeddedFiles(c) {
  const own = c.evidence?.embedded_files || [];
  if (own.length > 0) return own;
  if (c.method === 'L3-vision' && currentTargetScreenshot) {
    return [{ name: 'target-screenshot.png', data_uri: currentTargetScreenshot, shared: true }];
  }
  return [];
}

/* Render embedded visual evidence (screenshots, waypoint thumbnails, videos)
 * for any check whose result.json carries evidence/ files. The aggregator
 * embeds these as data URIs into evidence.embedded_files at dashboard build
 * time. We split images vs videos and render images as a horizontal scroll
 * strip (waypoint-style) and videos as inline <video> elements. */
function renderVisualEvidence(c) {
  const files = effectiveEmbeddedFiles(c);
  if (files.length === 0) return null;

  const images = files.filter(f => /\.(png|jpe?g|webp|gif)$/i.test(f.name));
  const videos = files.filter(f => /\.(mp4|webm|mov)$/i.test(f.name));
  if (images.length === 0 && videos.length === 0) return null;

  const wrap = el('div', { class: 'fc-visual' });
  const heading = el('div', { class: 'fc-visual-head' });
  heading.appendChild(iconEl('layers'));
  heading.appendChild(document.createTextNode(t('fc.visualEvidence')));
  heading.appendChild(el('span', { class: 'fc-visual-owner' }, [t('fc.visualFor', { check: c.check_id || c.name || '' })]));
  heading.appendChild(el('span', { class: 'fc-visual-count' }, [String(images.length + videos.length)]));
  wrap.appendChild(heading);

  if (images.length > 0) {
    const strip = el('div', { class: 'fc-shots' });
    if (images.length > 4) strip.dataset.many = 'true';
    const visible = images.slice(0, 3);
    visible.forEach((img, i) => {
      const fig = el('figure', { class: 'fc-shot' });
      const btn = el('button', { type: 'button', title: img.name || '' });
      btn.appendChild(el('img', { src: img.data_uri, alt: img.name, loading: 'lazy' }));
      btn.addEventListener('click', () => openLightbox(images, i, c.check_id || c.name || ''));
      fig.appendChild(btn);
      const cap = el('figcaption');
      // strip leading "NN-" prefix for cleaner labels
      const label = img.name.replace(/\.[^.]+$/, '').replace(/^\d+-/, '');
      cap.appendChild(el('span', { class: 'fc-shot-step' }, [String(i + 1).padStart(2, '0')]));
      cap.appendChild(el('span', { class: 'fc-shot-name' }, [label]));
      fig.appendChild(cap);
      strip.appendChild(fig);
    });
    if (images.length > visible.length) {
      const fig = el('figure', { class: 'fc-shot' });
      const more = el('button', { type: 'button', class: 'fc-shot-more' }, [t('fc.moreShots', { n: images.length - visible.length })]);
      more.addEventListener('click', () => openLightbox(images, visible.length, c.check_id || c.name || ''));
      fig.appendChild(more);
      strip.appendChild(fig);
    }
    wrap.appendChild(strip);
  }

  if (videos.length > 0) {
    videos.forEach(vid => {
      const v = el('video', {
        class: 'fc-video',
        src: vid.data_uri,
        controls: '',
        preload: 'metadata',
        playsinline: '',
      });
      wrap.appendChild(v);
    });
  }
  return wrap;
}

function renderCompactRow(c, kind) {
  const row = el('div', { class: 'compact-row ' + kind });
  const si = el('div', { class: 'si' });
  si.innerHTML = svgIcon(kind === 'pass' ? 'check' : 'minus');
  row.appendChild(si);
  const body = el('div');
  body.appendChild(el('div', { class: 'nm' }, [c.name || c.check_id]));
  body.appendChild(el('div', { class: 'id-sub' }, [c.check_id || '']));
  const meta = el('div', { class: 'compact-meta' });
  buildMetaPills(c).forEach(p => meta.appendChild(p));
  body.appendChild(meta);
  const summary = compactSummary(c, kind);
  if (summary) body.appendChild(el('div', { class: 'compact-summary' }, [summary]));
  const expandable = hasExpandableDetail(c, kind);
  if (expandable) {
    const detail = el('div', { class: 'compact-detail' });
    const detailsText = (c.evidence?.details || '').replace(/\s+/g, ' ').trim();
    if (detailsText) detail.appendChild(el('div', { class: 'compact-detail-text' }, [detailsText]));
    const matches = c.evidence?.matches || [];
    if (matches.length > 0) {
      const matchWrap = el('div', { class: 'compact-detail-matches' });
      matches.slice(0, 4).forEach(mt => {
        const tag = mt.pattern || mt.type || mt.label || mt.id || 'match';
        const text = (mt.matched_text || '').replace(/\s+/g, ' ').trim();
        if (!text) return;
        const chip = el('div', { class: 'mchip' });
        chip.appendChild(el('strong', null, [tag]));
        chip.appendChild(document.createTextNode(text));
        matchWrap.appendChild(chip);
      });
      if (matchWrap.children.length > 0) detail.appendChild(matchWrap);
    }
    body.appendChild(detail);
  }
  row.appendChild(body);
  const actions = el('div', { class: 'compact-actions' });
  const actionButtons = el('div', { class: 'action-buttons' });
  if (expandable) {
    const detailBtn = el('button', { class: 'detail-btn', type: 'button' }, [t('fc.showWhy')]);
    detailBtn.addEventListener('click', () => {
      row.classList.toggle('open');
      detailBtn.textContent = row.classList.contains('open') ? t('fc.hideWhy') : t('fc.showWhy');
    });
    actionButtons.appendChild(detailBtn);
  }
  const files = effectiveEmbeddedFiles(c);
  if (files.length > 0) {
    const btn = el('button', { class: 'asset-btn', type: 'button' });
    btn.appendChild(iconEl('layers'));
    btn.appendChild(document.createTextNode(t('fc.viewAssets')));
    btn.appendChild(el('span', null, [`(${t('fc.assetCount', { n: files.length })})`]));
    btn.addEventListener('click', () => openAssetSheet(c));
    actionButtons.appendChild(btn);
  }
  if (actionButtons.children.length > 0) actions.appendChild(actionButtons);
  row.appendChild(actions);
  return row;
}

/* ─── TIMELINE mode ─────────────────────────────────────── */
function renderTimeline(root) {
  const app = (DATA.apps || [])[currentAppIdx] || (DATA.apps || [])[0];
  if (!app || app.iterations.length < 2) return renderSingle(root);

  // Header + iteration strip — these stay regardless of sub-mode so the
  // user always has a "where am I in the trajectory" anchor at the top.
  const last = app.iterations[app.iterations.length - 1];
  const first = app.iterations[0];
  const lastRate = Math.round((last.summary?.pass_rate || 0) * 100);
  const firstRate = Math.round((first.summary?.pass_rate || 0) * 100);
  const totalDelta = lastRate - firstRate;

  const stripWrap = el('section', { style: 'margin-bottom: 28px;' });
  const stripHead = el('div', { class: 'section-head' });
  stripHead.appendChild(iconEl('layers'));
  stripHead.appendChild(document.createTextNode(t('timeline.title')));
  stripHead.appendChild(el('span', { class: 'badge' }, [t('timeline.iters', { n: app.iterations.length })]));
  if (totalDelta !== 0) {
    const tag = el('span', { class: 'head-tag' });
    tag.style.color = totalDelta > 0 ? 'var(--pass)' : 'var(--fail)';
    tag.appendChild(document.createTextNode(
      t('timeline.deltaSinceFirst', { sign: totalDelta > 0 ? '+' : '', delta: totalDelta })));
    stripHead.appendChild(tag);
  }
  stripWrap.appendChild(stripHead);

  // Iteration strip — clicking a stop drills into that iteration's full
  // audit body (sub-mode 'iter'). The "Δ Delta" stop on the left jumps
  // back to the new action-first delta view (sub-mode 'delta', default).
  const strip = el('div', { class: 'timeline-strip' });
  if (app.iterations.length > 6) strip.dataset.many = 'true';

  // "Δ Delta" pseudo-stop — always first, always present in History mode
  const deltaStop = el('button', {
    class: 'stop' + (timelineSubMode === 'delta' ? ' active' : ''),
    title: t('delta.action.title'),
  });
  deltaStop.appendChild(el('div', { class: 'iter' }, ['Δ ' + t('delta.action.title')]));
  deltaStop.appendChild(el('div', { class: `rate ${rateClass(lastRate)}` }, [`${lastRate}%`]));
  if (totalDelta !== 0) {
    const tdCls = totalDelta > 0 ? 'up' : 'down';
    const tdEl = el('div', { class: `delta ${tdCls}` });
    tdEl.appendChild(iconEl(totalDelta > 0 ? 'trendUp' : 'trendDn'));
    tdEl.appendChild(document.createTextNode(`${totalDelta > 0 ? '+' : ''}${totalDelta}`));
    deltaStop.appendChild(tdEl);
  }
  deltaStop.addEventListener('click', () => {
    timelineSubMode = 'delta';
    render();
  });
  strip.appendChild(deltaStop);

  app.iterations.forEach((it, i) => {
    const isActive = timelineSubMode === 'iter' && i === currentIterIdx;
    const stop = el('button', { class: 'stop' + (isActive ? ' active' : '') });
    stop.appendChild(el('div', { class: 'iter' }, [it.label || ('iter ' + it.iteration)]));
    const rate = Math.round((it.summary?.pass_rate || 0) * 100);
    stop.appendChild(el('div', { class: `rate ${rateClass(rate)}` }, [`${rate}%`]));
    let dStr = '—', dCls = '', dIcon = null;
    if (i > 0) {
      const prev = Math.round((app.iterations[i - 1].summary?.pass_rate || 0) * 100);
      const d = rate - prev;
      dStr = d > 0 ? `+${d}` : String(d);
      dCls = d > 0 ? 'up' : (d < 0 ? 'down' : '');
      if (d !== 0) dIcon = iconEl(d > 0 ? 'trendUp' : 'trendDn');
    }
    const dEl = el('div', { class: `delta ${dCls}` });
    if (dIcon) dEl.appendChild(dIcon);
    dEl.appendChild(document.createTextNode(dStr));
    stop.appendChild(dEl);
    const scenarioLabel = scenarioModeLabel(it);
    if (scenarioLabel) {
      stop.appendChild(el('div', { class: `scenario ${normalizedScenarioMode(it)}` }, [scenarioLabel]));
    }
    stop.addEventListener('click', () => {
      timelineSubMode = 'iter';
      currentIterIdx = i;
      expanded.clear();
      render();
    });
    strip.appendChild(stop);
  });
  stripWrap.appendChild(strip);
  root.appendChild(stripWrap);

  // Body — delta view (default) OR drill into selected iteration
  if (timelineSubMode === 'iter') {
    const iter = app.iterations[currentIterIdx];
    renderAuditBody(root, app, iter);
  } else {
    renderDeltaView(root, app);
  }
}

/* ─── TIMELINE delta view (action-first body) ──────────────
   The body of History mode when sub-mode is 'delta'. Built around
   buildIterationMatrix → classifyChange → sortIterationRows.

   Layout, top-down:
     1. Action panel — top 3 most actionable cards with 1-line advice
     2. Counter strip — Fixed / Regressed / Persistent-fail / New
     3. Filter chips — pivot the matrix below
     4. Delta matrix — check × iteration, sortable by archetype
*/
function renderDeltaView(root, app) {
  const iterations = app.iterations || [];
  const allRows = buildIterationMatrix(iterations);
  const sortedRows = sortIterationRows(allRows);

  // Group counts by archetype for the counter strip + filter chips.
  const counts = {
    'fixed': 0, 'regressed': 0, 'persistent-fail': 0, 'persistent-pass': 0,
    'flapping': 0, 'new-fail': 0, 'new-pass': 0, 'unknown': 0,
  };
  sortedRows.forEach(r => { counts[r.archetype] = (counts[r.archetype] || 0) + 1; });
  const newCount = counts['new-fail'] + counts['new-pass'];
  const changesCount = counts['fixed'] + counts['regressed'] + counts['persistent-fail']
                     + counts['flapping'] + counts['new-fail'] + counts['new-pass'];

  // ── Action panel (the user's "what should I do next?" answer) ──
  const actionPanel = renderActionPanel(sortedRows);
  if (actionPanel) root.appendChild(actionPanel);

  // ── Counter strip ──
  const counterStrip = el('section', { class: 'delta-counters' });
  [
    ['fixed',      'fixed'],
    ['regressed',  'regressed'],
    ['persistent', 'persistent-fail'],
    ['new',        null /* sum */],
  ].forEach(([cls, key]) => {
    const dc = el('div', { class: 'dc ' + cls });
    const n = key === null ? newCount : (counts[key] || 0);
    dc.appendChild(el('div', { class: 'n' }, [String(n)]));
    dc.appendChild(el('div', { class: 'l' }, [t('delta.counter.' + cls)]));
    counterStrip.appendChild(dc);
  });
  root.appendChild(counterStrip);

  // ── Filter chips ──
  const filterBar = el('section', { class: 'delta-filters', role: 'tablist' });
  const filterDefs = [
    ['changes',         changesCount],
    ['fixed',           counts['fixed']],
    ['regressed',       counts['regressed']],
    ['persistentFail',  counts['persistent-fail']],
    ['flapping',        counts['flapping']],
    ['new',             newCount],
    ['all',             sortedRows.length],
  ];
  filterDefs.forEach(([key, count]) => {
    const chip = el('button', {
      type: 'button',
      class: 'chip' + (timelineFilter === filterKeyFromUi(key) ? ' active' : ''),
      role: 'tab',
      'aria-selected': timelineFilter === filterKeyFromUi(key) ? 'true' : 'false',
    });
    chip.appendChild(document.createTextNode(t('delta.filter.' + key)));
    chip.appendChild(el('span', { class: 'count' }, [String(count)]));
    chip.addEventListener('click', () => {
      timelineFilter = filterKeyFromUi(key);
      timelineDrillSet.clear();
      render();
    });
    filterBar.appendChild(chip);
  });
  root.appendChild(filterBar);

  // ── Delta matrix ──
  const filtered = sortedRows.filter(r => matchesFilter(r, timelineFilter));
  root.appendChild(renderDeltaMatrix(iterations, filtered));
}

/* The chip labels (UI keys) don't 1:1 match the internal filter keys —
   the chip says "Persistent fail" but the state stores "persistent-fail".
   Centralize the mapping so the active-state lookup and the click
   handler agree. */
function filterKeyFromUi(uiKey) {
  switch (uiKey) {
    case 'changes':        return 'changes';
    case 'fixed':          return 'fixed';
    case 'regressed':      return 'regressed';
    case 'persistentFail': return 'persistent-fail';
    case 'flapping':       return 'flapping';
    case 'new':            return 'new';
    case 'all':            return 'all';
    default:               return 'changes';
  }
}

function matchesFilter(row, filter) {
  if (filter === 'all') return true;
  if (filter === 'changes') {
    return row.archetype !== 'persistent-pass' && row.archetype !== 'unknown';
  }
  if (filter === 'new') {
    return row.archetype === 'new-fail' || row.archetype === 'new-pass';
  }
  return row.archetype === filter;
}

/* Action panel — surfaces the top 3 most actionable rows as cards.
   Each card has the archetype tag, check name, 1-line advice, and a
   "View in matrix" link that scrolls to the corresponding row. */
function renderActionPanel(sortedRows) {
  // Pick up to 3 across the most-actionable archetypes. We use the
  // already-sorted rows so the priority order matches the rest of the
  // view. Skip persistent-pass entirely from the panel.
  const candidates = sortedRows.filter(r =>
    r.archetype !== 'persistent-pass' && r.archetype !== 'unknown' && r.archetype !== 'new-pass');
  const top = candidates.slice(0, 3);

  const wrap = el('section', { style: 'margin-bottom: 28px;' });
  const head = el('div', { class: 'section-head action' });
  head.appendChild(iconEl('bulb'));
  head.appendChild(document.createTextNode(t('delta.action.title')));
  head.appendChild(el('span', { class: 'badge' }, [String(top.length)]));
  wrap.appendChild(head);

  if (top.length === 0) {
    const empty = el('div', { class: 'delta-action-card', style: 'cursor: default;' });
    const advice = el('div', { class: 'ac-advice' }, [t('delta.action.empty')]);
    empty.appendChild(advice);
    wrap.appendChild(empty);
    return wrap;
  }

  const panel = el('div', { class: 'delta-action-panel' });
  top.forEach(row => panel.appendChild(actionCard(row)));
  wrap.appendChild(panel);
  return wrap;
}

function actionCard(row) {
  const card = el('div', { class: 'delta-action-card', 'data-archetype': row.archetype });

  const head = el('div', { class: 'ac-head' });
  head.appendChild(document.createTextNode(t('delta.archetype.' + row.archetype)));
  card.appendChild(head);

  const name = el('div', { class: 'ac-name' }, [row.name]);
  card.appendChild(name);
  card.appendChild(el('div', { class: 'ac-id' }, [row.check_id]));

  const advice = el('div', { class: 'ac-advice' }, [adviceFor(row)]);
  card.appendChild(advice);

  const foot = el('div', { class: 'ac-foot' });
  const sev = row.severity || 'minor';
  foot.appendChild(el('span', null, [sev]));
  const link = el('a', { class: 'ac-link', href: '#row-' + cssEscape(row.check_id) },
    [t('delta.action.viewRow')]);
  foot.appendChild(link);
  card.appendChild(foot);

  // Whole card click → expand the corresponding matrix row in place
  // and scroll to it. The explicit "View in matrix →" link does the
  // same thing — both routes feel right depending on which the user
  // grabs first.
  const goToRow = (e) => {
    e.preventDefault();
    timelineDrillSet.add(row.check_id);
    render();
    requestAnimationFrame(() => {
      const targetRow = document.getElementById('row-' + cssEscape(row.check_id));
      if (targetRow) targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  };
  card.addEventListener('click', goToRow);
  link.addEventListener('click', goToRow);

  return card;
}

function adviceFor(row) {
  const seq = row.history.filter(h => h !== null);
  switch (row.archetype) {
    case 'regressed': {
      // Find the last passing iter and use its label as "prev".
      const lastPass = [...seq].reverse().find(h => h.result === 'pass');
      const prevLabel = lastPass ? lastPass.label : 'iter 1';
      return t('delta.advice.regressed', { prev: prevLabel });
    }
    case 'new-fail':
      return t('delta.advice.new-fail');
    case 'persistent-fail':
      return t('delta.advice.persistent-fail', { n: seq.length });
    case 'flapping':
      return t('delta.advice.flapping');
    case 'fixed': {
      // Find the iter where it flipped P from F.
      const flip = seq.find((h, i) => i > 0 && h.result === 'pass' && seq[i - 1].result === 'fail');
      return t('delta.advice.fixed', { iter: (flip ? flip.label : seq[seq.length - 1].label) });
    }
    case 'new-pass':
      return t('delta.advice.new-pass');
    default:
      return '';
  }
}

/* CSS-safe escape for use in id/href attrs (check_ids contain '/'
   which is technically valid in id but inconvenient for selectors). */
function cssEscape(s) {
  return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
}

/* The check × iteration matrix. Sticky-header table with one row
   per check, one column per iteration, plus a head column with the
   check name and archetype tag. Click a row to toggle the drill-down. */
function renderDeltaMatrix(iterations, rows) {
  const wrap = el('section', { class: 'delta-matrix' });
  if (rows.length === 0) {
    wrap.appendChild(el('div', { class: 'empty-state' }, [t('delta.matrix.empty')]));
    return wrap;
  }

  const table = el('table');
  const thead = el('thead');
  const trh = el('tr');
  trh.appendChild(el('th', null, [t('delta.matrix.check')]));
  iterations.forEach(it => {
    trh.appendChild(el('th', { class: 'iter-col' }, [it.label || ('iter ' + it.iteration)]));
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = el('tbody');
  rows.forEach(row => {
    const tr = el('tr', {
      class: 'check-row',
      id: 'row-' + cssEscape(row.check_id),
      'data-archetype': row.archetype,
    });
    const head = el('td', { class: 'head' });
    head.appendChild(el('div', { class: 'check-name' }, [row.name]));
    head.appendChild(el('div', { class: 'check-id' }, [row.check_id]));
    head.appendChild(el('span', { class: 'archetype-tag', 'data-archetype': row.archetype },
      [t('delta.archetype.' + row.archetype)]));
    tr.appendChild(head);

    row.history.forEach(h => {
      const result = h ? h.result : 'empty';
      const td = el('td', { class: 'iter-cell ' + result });
      const pip = el('span', { class: 'pip' });
      const iconKey = (result === 'pass') ? 'check'
                    : (result === 'fail') ? 'x'
                    : (result === 'skipped') ? 'minus'
                    : 'minus';
      pip.innerHTML = svgIcon(iconKey);
      td.appendChild(pip);
      tr.appendChild(td);
    });

    tr.addEventListener('click', () => {
      if (timelineDrillSet.has(row.check_id)) timelineDrillSet.delete(row.check_id);
      else timelineDrillSet.add(row.check_id);
      render();
    });
    tbody.appendChild(tr);

    if (timelineDrillSet.has(row.check_id)) {
      tbody.appendChild(renderDrillRow(iterations, row));
    }
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

/* Per-check drill-down row — appears beneath a clicked check row.
   Shows: suggested fix (from the latest snapshot) + per-iteration
   evidence/details so the user can see exactly when and why the
   check changed status. */
function renderDrillRow(iterations, row) {
  const tr = el('tr', { class: 'drill-row' });
  const td = el('td', { colspan: iterations.length + 1 });
  const inner = el('div', { class: 'drill-inner' });

  // Latest non-null entry holds the most recent suggestion
  const latest = [...row.history].reverse().find(h => h !== null);
  if (latest && latest.suggestion) {
    const sg = el('div', { class: 'di-suggest' });
    sg.appendChild(el('span', { class: 'di-label' }, [t('delta.drilldown.suggestionLabel')]));
    sg.appendChild(document.createTextNode(latest.suggestion));
    inner.appendChild(sg);
  }

  const itersWrap = el('div', { class: 'di-iters' });
  row.history.forEach((h, idx) => {
    if (h === null) return;
    const line = el('div', { class: 'di-iter' });
    line.appendChild(el('span', { class: 'di-label-iter' }, [h.label]));
    line.appendChild(el('span', { class: 'di-result ' + h.result }, [h.result]));
    const det = h.details
      ? el('span', { class: 'di-detail' }, [h.details])
      : el('span', { class: 'di-detail empty' }, [t('delta.drilldown.noDetails')]);
    line.appendChild(det);
    itersWrap.appendChild(line);
  });
  inner.appendChild(itersWrap);

  // Footer link — drill all the way into a single iter's full audit
  if (latest) {
    const lastIdx = row.history.findIndex(h => h !== null && h.iter === latest.iter);
    const link = el('a', {
      href: '#',
      class: 'lib-lite-link',
      style: 'align-self: flex-start; margin-top: 4px;',
    }, [t('delta.drilldown.openFullAudit', { iter: latest.label })]);
    link.addEventListener('click', (e) => {
      e.preventDefault();
      timelineSubMode = 'iter';
      currentIterIdx = lastIdx >= 0 ? lastIdx : (iterations.length - 1);
      expanded.clear();
      render();
    });
    inner.appendChild(link);
  }

  td.appendChild(inner);
  tr.appendChild(td);
  return tr;
}

/* ─── COMPARE mode ──────────────────────────────────────── */
function renderCompare(root) {
  // Prefer a library-sourced synthetic pool when the user has picked
  // workspaces via the Library compare-queue. Falls back to the
  // CLI-passed apps[] array otherwise (original compare-mode behavior).
  const fromLibrary = Array.isArray(DATA._comparePool) && DATA._comparePool.length >= 2;
  const apps = fromLibrary ? DATA._comparePool : (DATA.apps || []);
  if (apps.length < 2) return renderSingle(root);

  // header
  const header = el('section', { class: 'header' });
  const left = el('div');
  const meta = el('div', { class: 'meta-line' });
  meta.appendChild(el('span', null, [t('compare.subtitle', { n: apps.length })]));
  // When sourced from Library, surface a "back to library" affordance
  // so the user can tweak their selection without re-picking from
  // scratch. Selection is still in compareQueue from earlier.
  if (fromLibrary) {
    meta.appendChild(el('span', { class: 'meta-sep' }, ['·']));
    const back = el('a', {
      href: '#',
      class: 'compare-back-link',
    }, [t('compare.backToLibrary')]);
    back.addEventListener('click', (e) => {
      e.preventDefault();
      currentMode = 'library';
      render();
    });
    meta.appendChild(back);
  }
  left.appendChild(meta);
  left.appendChild(el('h1', null, [t('compare.title')]));
  header.appendChild(left);

  const rates = apps.map(a => {
    const last = a.iterations[a.iterations.length - 1];
    return { name: a.name, rate: Math.round((last.summary?.pass_rate || 0) * 100) };
  });
  const top = [...rates].sort((a, b) => b.rate - a.rate)[0];
  const stat = el('div', { class: 'headline-stat' });
  const pct = el('div', { class: `pct ${rateClass(top.rate)}` }, [String(top.rate)]);
  pct.appendChild(el('span', { class: 'symbol' }, ['%']));
  stat.appendChild(pct);
  stat.appendChild(el('div', { class: 'label' }, [t('compare.leads', { name: top.name })]));
  header.appendChild(stat);
  root.appendChild(header);

  // app cards — switch to scroll mode for >4 apps
  const many = apps.length > 4;
  const appsEl = el('section', {
    class: 'compare-apps',
    style: many ? '' : `grid-template-columns: repeat(${apps.length}, minmax(0, 1fr));`,
  });
  if (many) appsEl.dataset.many = 'true';
  apps.forEach(app => {
    const last = app.iterations[app.iterations.length - 1];
    const summary = last.summary || {};
    const passPct = Math.round((summary.pass_rate || 0) * 100);
    const card = el('div', { class: 'app' });
    card.appendChild(el('div', { class: 'name' }, [app.name]));
    if (app.url) {
      const u = el('div', { class: 'url' });
      u.appendChild(iconEl('link'));
      u.appendChild(document.createTextNode(app.url));
      card.appendChild(u);
    }
    card.appendChild(el('div', { class: `rate ${rateClass(passPct)}` }, [`${passPct}%`]));
    card.appendChild(el('div', { class: 'stats' }, [
      el('span', { class: 'pass-st' }, [`${summary.passed || 0} ${t('compare.passShort')}`]),
      el('span', { class: 'fail-st' }, [`${summary.failed || 0} ${t('compare.failShort')}`]),
      el('span', null, [`${summary.skipped || 0} ${t('compare.skipShort')}`]),
    ]));
    if (last.screenshot_data_uri) {
      card.appendChild(el('img', { class: 'thumb', src: last.screenshot_data_uri, alt: app.name }));
    }
    appsEl.appendChild(card);
  });
  root.appendChild(appsEl);

  // matrix
  const matrix = buildMatrix(apps);
  const mw = el('section', { class: 'compare-matrix' });
  const table = el('table');

  const thead = el('thead');
  const trh = el('tr');
  trh.appendChild(el('th', null, [t('compare.col.check')]));
  apps.forEach(app => trh.appendChild(el('th', { class: 'app-col' }, [app.name])));
  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = el('tbody');
  let lastCategory = null;
  for (const row of matrix) {
    if (row.category !== lastCategory) {
      const cr = el('tr', { class: 'cat-row' });
      cr.appendChild(el('td', { colspan: apps.length + 1 }, [row.category]));
      tbody.appendChild(cr);
      lastCategory = row.category;
    }
    const tr = el('tr');
    const headCell = el('td');
    headCell.appendChild(el('div', { class: 'check-name' }, [row.name]));
    headCell.appendChild(el('div', { class: 'check-id' }, [row.check_id]));
    if (row.source) headCell.appendChild(el('div', { class: 'source-cite' }, [row.source.split(/[+;]/)[0].trim()]));
    tr.appendChild(headCell);

    apps.forEach(app => {
      const r = (row.results || {})[app.name];
      const result = r?.result || 'skipped';
      const td = el('td', { class: 'cell ' + result });
      const sIcon = el('div', { class: 'status-icon' });
      sIcon.innerHTML = svgIcon(STATUS_ICON[result] || 'minus');
      td.appendChild(sIcon);
      if (r?.details) td.appendChild(el('div', { class: 'small' }, [r.details]));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  mw.appendChild(table);
  root.appendChild(mw);

}

function buildMatrix(apps) {
  const seen = new Map();
  for (const app of apps) {
    const last = app.iterations[app.iterations.length - 1];
    for (const c of (last.checks || [])) {
      const cid = c.check_id;
      if (!cid) continue;
      if (!seen.has(cid)) {
        seen.set(cid, {
          check_id: cid,
          name: c.name || cid,
          category: c.category || '',
          severity: c.severity || 'minor',
          source: c.source || '',
          results: {},
        });
      }
      seen.get(cid).results[app.name] = {
        result: c.result,
        details: (c.evidence?.details || '').slice(0, 180),
      };
    }
  }
  const rows = [...seen.values()];
  rows.sort((a, b) => {
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return a.name.localeCompare(b.name);
  });
  return rows;
}

/* ─── TIMELINE delta matrix ─────────────────────────────── */
/* Build a check×iteration matrix for a single app's history.
   The result is row-oriented (one row per check_id), with each row
   carrying its full per-iteration history so the renderer can
   classify it (fixed/regressed/persistent/flapping/new) and drill
   into specific iterations on click. */
function buildIterationMatrix(iterations) {
  const seen = new Map();
  iterations.forEach((iter, iterIdx) => {
    for (const c of (iter.checks || [])) {
      const cid = c.check_id;
      if (!cid) continue;
      if (!seen.has(cid)) {
        seen.set(cid, {
          check_id: cid,
          name: c.name || cid,
          category: c.category || '',
          severity: c.severity || 'minor',
          source: c.source || '',
          history: new Array(iterations.length).fill(null),
        });
      }
      // Latest iter wins for the row metadata (name/category/source) so
      // schema drift is visible to the user via the latest snapshot.
      const row = seen.get(cid);
      row.name = c.name || row.name;
      row.category = c.category || row.category;
      row.source = c.source || row.source;
      row.severity = c.severity || row.severity;
      row.history[iterIdx] = {
        iter: iter.iteration,
        label: iter.label || ('iter ' + iter.iteration),
        result: c.result,
        details: (c.evidence?.details || '').slice(0, 240),
        suggestion: c.suggestion || '',
      };
    }
  });
  const rows = [...seen.values()];
  rows.forEach(row => {
    row.archetype = classifyChange(row);
  });
  return rows;
}

/* Categorize a check's result history into an actionable archetype.
   This is the spine of the new Timeline UX — every row gets exactly
   one label so users can filter / sort / count without re-deriving. */
function classifyChange(row) {
  // Two views of the history:
  // - rawSeq: every iter where the check ran (used for "new" detection
  //   so a check that was skipped in iter 1 and ran in iter 2 still
  //   counts as appearing in 2 iters, not as new)
  // - decSeq: only pass/fail outcomes (used for archetype decisions).
  //   skipped is treated as "no signal" — it neither breaks
  //   persistent-pass nor counts as a transition.
  const rawSeq = row.history.filter(h => h !== null).map(h => h.result);
  if (rawSeq.length === 0) return 'unknown';

  const decSeq = rawSeq.filter(r => r === 'pass' || r === 'fail');
  const totalIters = row.history.length;

  // New = first appears in the last iteration only (the check_id was
  // added between iter N-1 and iter N — user added a new check or
  // upgraded the catalog). Use rawSeq because a check that was skipped
  // before should NOT count as new just because it now has a verdict.
  if (rawSeq.length === 1 && row.history[totalIters - 1]) {
    const lastRaw = rawSeq[0];
    if (lastRaw === 'pass') return 'new-pass';
    if (lastRaw === 'fail') return 'new-fail';
    return 'unknown';
  }

  // Everything from here on uses decSeq, so a check with only skipped
  // results (no signal anywhere) bubbles to 'unknown' instead of
  // pretending to be persistent-pass.
  if (decSeq.length === 0) return 'unknown';
  const last = decSeq[decSeq.length - 1];

  // Count transitions to detect flap. A check that goes P→F→P→F is
  // probably a flaky selector or a non-deterministic test. skipped
  // gaps don't count as transitions: P→S→P stays "stable pass".
  let transitions = 0;
  for (let i = 1; i < decSeq.length; i++) {
    if (decSeq[i] !== decSeq[i - 1]) transitions++;
  }
  if (transitions >= 2) return 'flapping';

  // Stable bands — same decisive result throughout. skipped iters are
  // ignored, so ['pass','skipped','pass'] is persistent-pass and
  // ['fail','skipped'] is persistent-fail.
  const allFail = decSeq.every(r => r === 'fail');
  const allPass = decSeq.every(r => r === 'pass');
  if (allFail) return 'persistent-fail';
  if (allPass) return 'persistent-pass';

  // Single transition — clean fix or clean regression. We use the
  // LAST decisive result rather than the count to decide direction so
  // a P→F→F→F counts as 'regressed' (one transition, ended fail).
  if (last === 'pass') return 'fixed';
  if (last === 'fail') return 'regressed';

  return 'unknown';
}

/* Stable ordering for archetypes — most actionable first. The Timeline
   matrix uses this so the user's eye lands on regressions before
   flappers before persistent failures before noise.

   The "actionable" archetypes (regressed → new-fail → persistent-fail
   → flapping) share a tight band so severity can lift a critical
   persistent-fail above a minor regressed. The "feedback" archetypes
   (fixed/new-pass) and "noise" (persistent-pass/unknown) live in
   separate bands that severity can't promote across — a critical
   persistent-pass shouldn't displace any actual regression. */
const ARCHETYPE_BAND = {
  'regressed':       0,  // band A — actionable
  'new-fail':        0,
  'persistent-fail': 0,
  'flapping':        0,
  'fixed':           1,  // band B — feedback
  'new-pass':        1,
  'persistent-pass': 2,  // band C — noise
  'unknown':         2,
};
/* Within band A, this is the tiebreaker before severity. */
const ARCHETYPE_RANK = {
  'regressed':       0,
  'new-fail':        1,
  'persistent-fail': 2,
  'flapping':        3,
  'fixed':           0,
  'new-pass':        1,
  'persistent-pass': 0,
  'unknown':         1,
};

const SEVERITY_WEIGHT = { critical: 0, major: 1, minor: 2, info: 3 };

/* Composite score: band × 1000 + severity × 10 + archetype-rank.
   - band first (a critical persistent-pass cannot beat any band-A row)
   - severity second (within band A, critical beats major regardless
     of archetype — so a critical persistent-fail surfaces above a
     minor regressed)
   - archetype-rank third (same band+severity → use archetype priority)
*/
function rowSortScore(row) {
  const band = ARCHETYPE_BAND[row.archetype] ?? 9;
  const sev  = SEVERITY_WEIGHT[row.severity] ?? 4;
  const rank = ARCHETYPE_RANK[row.archetype] ?? 9;
  return band * 1000 + sev * 10 + rank;
}

function sortIterationRows(rows) {
  return rows.slice().sort((a, b) => {
    const sa = rowSortScore(a);
    const sb = rowSortScore(b);
    if (sa !== sb) return sa - sb;
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return a.name.localeCompare(b.name);
  });
}

/* Backwards-compat alias kept in case other code referenced this name. */
const ARCHETYPE_PRIORITY = ARCHETYPE_RANK;

init();
</script>
