<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · uxaudit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* neutral dark — ChatGPT-style. pure grays with no color tint. WCAG AA contrast on body text. */
  --bg-0:    #0d0d0d;
  --bg-1:    #171717;
  --bg-2:    #212121;
  --bg-3:    #2f2f2f;
  --bg-4:    #3f3f3f;

  --line:    #303030;
  --line-2:  #454545;

  --fg-0:    #ececec;          /* primary text — 14.8:1 vs bg-0 */
  --fg-1:    #d4d4d4;          /* body — 11.7:1 */
  --fg-2:    #b4b4b4;          /* secondary — 8.1:1 */
  --fg-3:    #8e8e8e;          /* meta / labels — 4.9:1 */
  --fg-4:    #909090;          /* tertiary meta — 5.0:1 */

  --pass:    #3ecf8e;          /* teal-leaning green, AA compliant on dark BG */
  --pass-bg: rgba(62, 207, 142, 0.13);
  --pass-bd: rgba(62, 207, 142, 0.45);

  --fail:    #ef4444;          /* neutral red — less pink than coral */
  --fail-bg: rgba(239, 68, 68, 0.13);
  --fail-bd: rgba(239, 68, 68, 0.46);

  --warn:    #f5b73a;
  --warn-bg: rgba(245, 183, 58, 0.13);
  --warn-bd: rgba(245, 183, 58, 0.42);

  --skip:    #8e8e8e;
  --skip-bg: rgba(142, 142, 142, 0.10);
  --skip-bd: rgba(142, 142, 142, 0.36);

  --accent:    #10a37f;          /* OpenAI signature teal green */
  --accent-bg: rgba(16, 163, 127, 0.13);
  --accent-bd: rgba(16, 163, 127, 0.45);
  --accent-fg: #0d0d0d;          /* text on solid --accent — 7.1:1 */

  --shadow-sm: 0 1px 0 rgba(255,255,255,0.05) inset;
  --shadow-md: 0 1px 0 rgba(255,255,255,0.06) inset, 0 8px 24px rgba(0,0,0,0.4);
  --radius:    6px;
  --radius-lg: 10px;

  /* spacing scale (4-base) — use these instead of arbitrary px in new code */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  /* type scale (8 sizes) — use these instead of arbitrary px in new code */
  --text-xs:      11px;
  --text-sm:      12.5px;
  --text-base:    14px;
  --text-md:      16px;
  --text-lg:      20px;
  --text-xl:      28px;
  --text-display: 56px;
  --text-hero:    96px;

  /* semantic intent layer — alias the raw bg/fg/line scales above so new
     code can use intent-named tokens. Old code keeps using --bg-* / --fg-*
     directly; both work. */
  --surface-page:    var(--bg-0);
  --surface-card:    var(--bg-1);
  --surface-elev:    var(--bg-2);
  --surface-input:   var(--bg-3);
  --text-primary:    var(--fg-0);
  --text-secondary:  var(--fg-2);
  --text-meta:       var(--fg-3);
  --text-disabled:   var(--fg-4);
  --border-default:  var(--line);
  --border-strong:   var(--line-2);

  /* card edge highlight (Vercel-style top metallic edge). Top stop is a
     subtle white-tinted line; fades to transparent. Used as a second
     background-image layer on premium cards. */
  --card-edge: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0) 38%);

  /* motion tokens — keep all transitions consistent and short */
  --ease:         cubic-bezier(0.2, 0.8, 0.2, 1);
  --motion-fast:  120ms;
  --motion-base:  180ms;
  --motion-slow:  320ms;
}

/* Light mode — pure white and neutral grays, OpenAI-style. WCAG AA on every text role. */
[data-theme="light"] {
  --bg-0:    #ffffff;          /* pure white base */
  --bg-1:    #fafafa;
  --bg-2:    #f4f4f4;
  --bg-3:    #ececec;
  --bg-4:    #e0e0e0;

  --line:    #e5e5e5;
  --line-2:  #d4d4d4;

  --fg-0:    #0d0d0d;          /* 19:1 */
  --fg-1:    #2b2b2b;          /* 13:1 */
  --fg-2:    #484848;          /* 8.3:1 */
  --fg-3:    #686868;          /* 5.4:1 */
  --fg-4:    #6d6d6d;          /* 4.9:1 */

  --pass:    #0d7d5d;          /* WCAG AA on white — 5.1:1, teal-leaning */
  --pass-bg: rgba(13, 125, 93, 0.10);
  --pass-bd: rgba(13, 125, 93, 0.42);

  --fail:    #c81e3a;
  --fail-bg: rgba(200, 30, 58, 0.08);
  --fail-bd: rgba(200, 30, 58, 0.42);

  --warn:    #a35a00;          /* WCAG AA on white */
  --warn-bg: rgba(163, 90, 0, 0.10);
  --warn-bd: rgba(163, 90, 0, 0.40);

  --skip:    #686868;
  --skip-bg: rgba(104, 104, 104, 0.08);
  --skip-bd: rgba(104, 104, 104, 0.36);

  --accent:    #0d7d5d;          /* OpenAI green, darkened for AA on white — 5.1:1 */
  --accent-bg: rgba(13, 125, 93, 0.10);
  --accent-bd: rgba(13, 125, 93, 0.42);
  --accent-fg: #ffffff;          /* text on solid --accent — 5.1:1 */

  --shadow-sm: 0 1px 0 rgba(0,0,0,0.04) inset;
  --shadow-md: 0 1px 0 rgba(0,0,0,0.04) inset, 0 8px 24px rgba(0,0,0,0.08);

  /* light-mode equivalents of the same intent layer */
  --surface-page:    var(--bg-0);
  --surface-card:    var(--bg-1);
  --surface-elev:    var(--bg-2);
  --surface-input:   var(--bg-3);
  --text-primary:    var(--fg-0);
  --text-secondary:  var(--fg-2);
  --text-meta:       var(--fg-3);
  --text-disabled:   var(--fg-4);
  --border-default:  var(--line);
  --border-strong:   var(--line-2);

  /* On a cream surface the metallic edge needs to come from a darker tint,
     not white — otherwise it disappears against bg-0. */
  --card-edge: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0) 38%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); }
html { scroll-behavior: smooth; }

/* Honor user preference: kill all motion when prefers-reduced-motion is on. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  font-family: "Geist", -apple-system, system-ui, sans-serif;
  color: var(--fg-0);
  font-size: 15px;
  line-height: 1.6;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  letter-spacing: -0.005em;
}

::selection { background: var(--accent); color: var(--bg-0); }

.mono {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-feature-settings: "ss01";
  letter-spacing: 0;
}

button {
  background: none;
  border: none;
  font: inherit;
  color: inherit;
  cursor: pointer;
  padding: 0;
  letter-spacing: inherit;
}
/* Universal focus ring — applies to every interactive element. We rely
   on focus-visible (not :focus) so mouse clicks don't show a ring, only
   keyboard navigation does. The ring is the accent color so it's clearly
   visible against any surface in either theme. */
button:focus-visible,
a:focus-visible,
summary:focus-visible,
[role="tab"]:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
/* Make sure native default focus ring on summary in some browsers
   doesn't compete with ours. */
summary { outline: none; }

a { color: var(--fg-1); text-decoration: none; }
a:hover { color: var(--fg-0); }

/* ─── icon system ──────────────────────────────────────── */
.icon {
  display: inline-flex;
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.icon svg { width: 100%; height: 100%; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke: currentColor; }
.icon-lg { width: 22px; height: 22px; }
.icon-xl { width: 32px; height: 32px; }

/* ─── shell ────────────────────────────────────────────── */
.shell {
  max-width: 1480px;
  margin: 0 auto;
  padding: 0 36px 104px;
}

/* ─── topbar ───────────────────────────────────────────── */
.topbar {
  display: flex;
  align-items: center;
  gap: 24px;
  height: 60px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 48px;
  position: sticky;
  top: 0;
  background: var(--bg-0);
  z-index: 50;
}
.topbar .brand {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-0);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.015em;
}
.topbar .brand .accent-dot {
  width: 8px;
  height: 8px;
  background: var(--accent);
  border-radius: 50%;
}
.topbar .brand .sub {
  color: var(--fg-3);
  font-weight: 400;
  font-size: var(--text-sm);
  margin-left: 4px;
}
.topbar nav {
  display: flex;
  gap: 4px;
  margin-left: 24px;
}
.topbar nav button {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: var(--radius);
  color: var(--fg-2);
  font-size: 13.5px;
  font-weight: 500;
  transition: color 0.12s ease, background 0.12s ease;
}
.topbar nav button:hover {
  color: var(--fg-0);
  background: var(--bg-2);
}
.topbar nav button.active {
  color: var(--fg-0);
  background: var(--bg-3);
  box-shadow: var(--shadow-sm);
}
.topbar nav button.disabled {
  color: var(--fg-4);
  cursor: not-allowed;
}
.topbar nav button.disabled:hover { background: transparent; color: var(--fg-4); }
.topbar .spacer { flex: 1; }
.topbar .app-switcher {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-right: 14px;
}
.topbar .app-switcher button {
  font-size: 11.5px;
  padding: 5px 10px;
  border-radius: 4px;
  color: var(--fg-3);
  font-weight: 500;
  transition: color 0.12s ease, background 0.12s ease;
}
.topbar .app-switcher button:hover { color: var(--fg-1); }
.topbar .app-switcher button.active {
  color: var(--fg-0);
  background: var(--bg-3);
  box-shadow: var(--shadow-sm);
}
.topbar .meta {
  font-size: var(--text-sm);
  color: var(--fg-3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .toggles {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 12px;
  padding-left: 12px;
  border-left: 1px solid var(--line);
}
.topbar .icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--radius);
  color: var(--fg-2);
  background: transparent;
  border: 1px solid var(--line);
  transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
}
.topbar .icon-btn:hover {
  color: var(--fg-0);
  background: var(--bg-2);
  border-color: var(--line-2);
}
.topbar .icon-btn .icon { width: 14px; height: 14px; }
/* icon-btn as <a> (e.g. GitHub link) — strip underline, keep size */
.topbar a.icon-btn { text-decoration: none; }
.topbar .gh-btn .icon { width: 15px; height: 15px; }
/* Override the global .icon svg stroke-based rule — the GitHub Invertocat
   mark is a filled path, not a stroked outline. */
.topbar .gh-btn .icon svg { width: 100%; height: 100%; display: block; fill: currentColor; stroke: none; }
/* Pin GitHub mark to the official brand fills: white on dark, black on light.
   The SVG uses fill:currentColor, so we only need to set `color` here. */
.topbar .gh-btn { color: #ffffff; }
[data-theme="light"] .topbar .gh-btn { color: #000000; }
/* Keep the mark pure on hover too — just shift the background for feedback. */
.topbar .gh-btn:hover { color: #ffffff; }
[data-theme="light"] .topbar .gh-btn:hover { color: #000000; }
.topbar .lang-btn {
  font-size: var(--text-xs);
  padding: 6px 10px;
  height: 30px;
  font-weight: 600;
  letter-spacing: 0.04em;
  border-radius: var(--radius);
  color: var(--fg-2);
  background: transparent;
  border: 1px solid var(--line);
  transition: color 0.12s ease, background 0.12s ease, border-color 0.12s ease;
}
.topbar .lang-btn:hover {
  color: var(--fg-0);
  background: var(--bg-2);
  border-color: var(--line-2);
}

/* ─── header ───────────────────────────────────────────── */
.header {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 56px;
  align-items: end;
  margin-bottom: 40px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--line);
}
.header .meta-line {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  color: var(--fg-3);
  font-size: 13px;
}
.header .meta-line .dot { width: 3px; height: 3px; background: var(--fg-4); border-radius: 50%; }
.header .meta-line a {
  color: var(--fg-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.header .meta-line a:hover { color: var(--fg-0); }
.header h1 {
  font-size: clamp(40px, 5vw, 56px);
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.035em;
  color: var(--fg-0);
  word-break: break-word;
}

.headline-stat {
  text-align: right;
  flex-shrink: 0;
}
.headline-stat .pct {
  font-size: clamp(80px, 10vw, 120px);
  font-weight: 500;
  line-height: 0.86;
  letter-spacing: -0.05em;
  display: block;
  font-variant-numeric: tabular-nums;
}
.headline-stat .pct .symbol {
  font-size: 0.5em;
  font-weight: 400;
  color: var(--fg-3);
  margin-left: 2px;
}
.headline-stat .pct.high { color: var(--pass); }
.headline-stat .pct.mid { color: var(--warn); }
.headline-stat .pct.low { color: var(--fail); }
.headline-stat .label {
  font-size: 13px;
  color: var(--fg-3);
  margin-top: 6px;
  letter-spacing: 0.005em;
}

/* ─── verdict block (info hierarchy L1) ────────────────── */
.verdict {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 56px;
  align-items: end;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.verdict .v-meta {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  color: var(--fg-3);
  font-size: 13px;
}
.verdict .v-meta .dot { width: 3px; height: 3px; background: var(--fg-4); border-radius: 50%; }
.verdict .v-meta a { color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px; }
.verdict .v-meta a:hover { color: var(--fg-0); }
.verdict h1 {
  font-size: clamp(40px, 5vw, var(--text-display));
  font-weight: 600;
  line-height: 1.02;
  letter-spacing: -0.04em;
  color: var(--fg-0);
  word-break: break-word;
  margin-bottom: var(--space-3);
  font-feature-settings: "ss01", "cv11";
}
.verdict .v-status {
  font-size: var(--text-base);
  color: var(--fg-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.verdict .v-status .v-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.verdict .v-status.high .v-dot { background: var(--pass); box-shadow: 0 0 12px var(--pass); }
.verdict .v-status.mid .v-dot  { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
.verdict .v-status.low .v-dot  { background: var(--fail); box-shadow: 0 0 12px var(--fail); }
.verdict .v-substats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}
.verdict .v-substats .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 999px;
  font-size: var(--text-sm);
  color: var(--fg-2);
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.verdict .v-substats .chip strong {
  color: var(--fg-0);
  font-weight: 600;
}
.verdict .v-substats .chip.risk {
  color: var(--warn);
  border-color: var(--warn-bd);
  background: var(--warn-bg);
}

/* ─── hero action — "X things to fix" / "all clear"
       Replaces the old .v-num pass-rate display. The pass rate moved
       into the .v-substats chip row so the right side can be 100%
       focused on "what to do next". */
.verdict .v-action {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: var(--space-1);
  text-decoration: none;
  color: inherit;
  border-left: 1px solid var(--line);
  padding-left: var(--space-7);
  flex-shrink: 0;
  transition: opacity 0.16s ease;
}
.verdict .v-action:hover { opacity: 0.78; }
.verdict .v-action .va-num {
  font-size: clamp(80px, 10vw, var(--text-hero));
  font-weight: 500;
  line-height: 0.86;
  letter-spacing: -0.06em;
  display: block;
  font-variant-numeric: tabular-nums slashed-zero;
  font-feature-settings: "ss01", "tnum", "zero";
  color: var(--fg-0);
  text-align: right;
}
.verdict .v-action .va-num.fix      { color: var(--accent); }
.verdict .v-action .va-num.allclear { color: var(--pass); }
.verdict .v-action .va-num .va-icon {
  display: inline-block;
  vertical-align: middle;
}
.verdict .v-action .va-num .va-icon svg {
  width: 0.8em;
  height: 0.8em;
  stroke-width: 1.6;
}
.verdict .v-action .va-label {
  font-size: var(--text-base);
  color: var(--fg-2);
  letter-spacing: -0.005em;
  margin-top: var(--space-1);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.verdict .v-action .va-label .va-arrow {
  display: inline-flex;
  width: 14px;
  height: 14px;
  color: var(--fg-3);
  transition: transform 0.16s ease;
}
.verdict .v-action:hover .va-label .va-arrow {
  transform: translateX(3px);
  color: var(--fg-0);
}
.verdict .v-action .va-hint {
  font-size: var(--text-xs);
  color: var(--fg-4);
  letter-spacing: 0.02em;
}

/* ─── band breakdown row (UX / UI Risk) ─────────────────── */
.band-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}
.band-row .bcard {
  /* Vercel-style gradient border: 2 background-image layers, the first
     paints the inner card surface, the second paints the border ring with
     the metallic edge highlight on top fading down to flat. */
  background:
    linear-gradient(var(--surface-card), var(--surface-card)) padding-box,
    var(--card-edge) border-box,
    var(--border-default) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: transform var(--motion-fast) var(--ease),
              border-color var(--motion-fast) var(--ease),
              box-shadow var(--motion-base) var(--ease);
}
.band-row .bcard:hover {
  transform: translateY(-1px);
  background:
    linear-gradient(var(--surface-card), var(--surface-card)) padding-box,
    var(--card-edge) border-box,
    var(--border-strong) border-box;
}
.band-row .bcard .bcard-tag {
  font-size: var(--text-sm);
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
}
.band-row .bcard .bcard-name {
  font-size: 18px;
  font-weight: 500;
  color: var(--fg-0);
  letter-spacing: -0.01em;
  margin-top: 2px;
}
.band-row .bcard .bcard-desc {
  font-size: 13px;
  line-height: 1.6;
  color: var(--fg-3);
  max-width: 52ch;
}
.band-row .bcard .bcard-bar {
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 8px;
}
.band-row .bcard .bcard-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.4s ease;
}
.band-row .bcard .bcard-fill.high { background: var(--pass); }
.band-row .bcard .bcard-fill.mid  { background: var(--warn); }
.band-row .bcard .bcard-fill.low  { background: var(--fail); }
.band-row .bcard .bcard-stats {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 13px;
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  margin-top: 8px;
}
.band-row .bcard .bcard-rate {
  font-size: 24px;
  font-weight: 500;
  color: var(--fg-0);
  letter-spacing: -0.02em;
}
.band-row .bcard .bcard-rate.high { color: var(--pass); }
.band-row .bcard .bcard-rate.mid  { color: var(--warn); }
.band-row .bcard .bcard-rate.low  { color: var(--fail); }

/* ─── top fixes (info hierarchy L1.7 — cross-check synthesis, ranked) */
.top-fixes { margin-bottom: 48px; }
.top-fixes .tf-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 14px;
}
.top-fixes .tf-title {
  font-size: var(--text-sm);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}
.top-fixes .tf-title .icon { color: var(--accent); }
.top-fixes .tf-badge {
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  text-transform: none;
  letter-spacing: 0;
}
.top-fixes .tf-context-badge {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--fg-3);
  border: 1px dashed var(--line-2);
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: 0;
}
.top-fixes .tf-context-badge.on {
  color: var(--pass);
  border-color: var(--pass-bd);
  border-style: solid;
}
.top-fixes .tf-sub {
  font-size: var(--text-base);
  color: var(--fg-3);
  margin-bottom: 18px;
  max-width: 60ch;
}
.proposal-card {
  /* Gradient border with the accent rail kept on the left as a 3px stripe.
     We achieve both at once by stacking 3 background-image layers in
     border-box space: inner surface, top metallic edge, base border color. */
  background:
    linear-gradient(var(--surface-card), var(--surface-card)) padding-box,
    var(--card-edge) border-box,
    var(--border-default) border-box;
  border: 1px solid transparent;
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
  /* Extra left padding reserves a column for the absolutely-positioned rank
     marker (.proposal-rank). Sized to fit "#99" comfortably so any plausible
     ranking number stays inside the gutter without overlapping content.
     The rank itself is left:22px so it has 22..68 = 46px of width. */
  padding: 20px 22px 20px 76px;
  margin-bottom: 14px;
  /* Plain block layout — no grid. We tried `display: grid` with span-99 on
     the rank cell and it created empty rows that ballooned the card height
     by ~370px per card. Absolute positioning for the rank sidesteps all of
     that. Children stack in normal block flow. */
  position: relative;
  box-shadow: var(--shadow-sm);
  /* Stagger entry: each card animates in 60ms after the previous, driven
     by --card-index inline style set in renderTopFixes. */
  animation: card-in var(--motion-slow) var(--ease) both;
  animation-delay: calc(var(--card-index, 0) * 60ms);
  transition: transform var(--motion-fast) var(--ease),
              box-shadow var(--motion-base) var(--ease);
}
.proposal-card:hover {
  transform: translateY(-1px);
  box-shadow:
    var(--shadow-sm),
    0 8px 24px rgba(0, 0, 0, 0.12);
}

@keyframes card-in {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.proposal-card .proposal-rank {
  /* Absolutely positioned in the card's reserved left gutter. Takes the rank
     entirely out of block flow so it can't influence sibling widths or row
     heights. The card reserves 54px of left padding for this column. */
  position: absolute;
  left: 22px;
  top: 22px;
  font-family: 'Geist Mono', monospace;
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.proposal-card .proposal-title {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--fg-0);
  line-height: 1.35;
}
.proposal-card .proposal-addresses {
  font-size: var(--text-xs);
  color: var(--fg-3);
  margin-top: 6px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.proposal-card .proposal-addresses .label {
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-4);
  margin-right: 2px;
}
.proposal-card .proposal-addresses .chip {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  padding: 2px 7px;
  border-radius: 3px;
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  color: var(--fg-2);
}
.proposal-card .proposal-addresses .chip.partial {
  border-style: dashed;
  color: var(--fg-3);
}
.proposal-card .proposal-summary {
  /* The 1-sentence elaboration of the title — visible by default. Sits
     directly under the title and addresses, before why_first, so the
     reader gets the "what + why" before the rank justification. */
  font-size: var(--text-base);
  color: var(--fg-1);
  line-height: 1.5;
  margin-top: 8px;
}
.proposal-card details.proposal-impl {
  /* Default-collapsed accordion holding concrete_steps + estimated_files.
     The deliberate move: title/summary/why are the headline; impl pointers
     live here so the reader doesn't drown in tutorial text on first scan. */
  margin-top: 12px;
  border-top: 1px dashed var(--line);
  padding-top: 10px;
}
.proposal-card details.proposal-impl > summary {
  list-style: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-xs);
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 4px 0;
  user-select: none;
}
.proposal-card details.proposal-impl > summary::-webkit-details-marker { display: none; }
.proposal-card details.proposal-impl > summary:hover { color: var(--fg-1); }
.proposal-card details.proposal-impl > summary .chev {
  display: inline-block;
  width: 12px;
  height: 12px;
  transition: transform var(--motion-fast) var(--ease);
}
.proposal-card details.proposal-impl[open] > summary .chev { transform: rotate(90deg); }
.proposal-card details.proposal-impl > summary .pi-badge {
  margin-left: auto;
  font-family: 'Geist Mono', monospace;
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
  color: var(--fg-4);
  text-transform: none;
  letter-spacing: normal;
}
.proposal-card details.proposal-impl > .proposal-impl-body {
  padding-top: 8px;
}
.proposal-card .proposal-section {
  margin-top: 10px;
  font-size: var(--text-base);
  color: var(--fg-1);
  line-height: 1.6;
}
.proposal-card .proposal-section .ps-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-3);
  margin-bottom: 4px;
}
.proposal-card .proposal-steps {
  margin: 0;
  padding-left: 18px;
  color: var(--fg-1);
  font-size: var(--text-base);
  line-height: 1.6;
}
.proposal-card .proposal-steps li { margin-bottom: 2px; }
.proposal-card .proposal-files {
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.proposal-card .proposal-files .fchip {
  background: var(--bg-2);
  border: 1px solid var(--line);
  padding: 2px 7px;
  border-radius: 3px;
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
}
.tf-deferred {
  margin-top: 10px;
  padding: 12px 16px;
  background: var(--bg-1);
  border: 1px dashed var(--line-2);
  border-radius: var(--radius);
}
.tf-deferred .tf-d-head {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-3);
  margin-bottom: 6px;
}
.tf-deferred .tf-d-sub {
  font-size: var(--text-sm);
  color: var(--fg-3);
  margin-bottom: 8px;
}
.tf-deferred ul {
  margin: 0;
  padding-left: 18px;
  font-size: var(--text-sm);
  color: var(--fg-2);
}
.tf-deferred li { margin-bottom: 2px; }

/* Audit summary — the proposer's one-sentence headline.
   Sits below the section head, above the diagnosis row. Has editorial weight
   without competing with the page-level verdict at the top of the audit. */
.tf-verdict-block {
  margin: 4px 0 22px;
  padding: 14px 18px 16px;
  border-left: 3px solid var(--accent);
  background: var(--accent-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
}
.tf-verdict-block .tf-verdict-label {
  display: block;
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin-bottom: 6px;
}
.tf-verdict-block .tf-verdict-text {
  font-size: var(--text-lg);
  font-weight: 500;
  line-height: 1.4;
  color: var(--fg-0);
  letter-spacing: -0.005em;
}
.tf-context-detail {
  margin: -10px 0 22px;
  padding: 8px 14px;
  font-size: var(--text-sm);
  color: var(--fg-2);
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-left: 2px solid var(--pass);
  border-radius: var(--radius);
  line-height: 1.5;
}

/* Diagnosis row — root_causes rendered as small cards in a responsive grid.
   Each card names a cluster, shows how many fails it explains, and the
   proposer's rationale for the cluster. */
.tf-diagnosis {
  margin-bottom: 24px;
}
.tf-diagnosis .tf-d-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
}
.tf-diagnosis .tf-d-label {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
}
.tf-diagnosis .tf-d-hint {
  font-size: var(--text-xs);
  color: var(--fg-4);
}
.tf-diagnosis .tf-d-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 10px;
}
.rootcause-card {
  padding: 12px 14px 14px;
  background: var(--surface-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  line-height: 1.5;
  scroll-margin-top: 80px;
}
.rootcause-card .rc-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 4px;
}
.rootcause-card .rc-count {
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-bg);
  padding: 1px 6px;
  border-radius: 3px;
  white-space: nowrap;
}
.rootcause-card .rc-name {
  font-weight: 600;
  color: var(--fg-0);
  font-size: var(--text-base);
}
.rootcause-card .rc-rationale {
  color: var(--fg-2);
}

/* Top-of-section accounting strip: how many fails are covered, deferred,
   missing. Lets the reader see at a glance whether the proposer left gaps. */
.tf-accounting {
  margin: -8px 0 18px;
  font-size: var(--text-xs);
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tf-accounting .ta-missing {
  color: var(--fail);
}
.tf-accounting.all-covered { color: var(--pass); text-transform: none; letter-spacing: 0; }

/* Coverage stat per proposal — small badge in the card head showing
   "closes N fails" so the synthesis value is visible at a glance. */
.proposal-card .proposal-coverage {
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  padding: 1px 7px;
  border-radius: 3px;
  margin-left: 8px;
  vertical-align: middle;
  white-space: nowrap;
  font-weight: 500;
  text-transform: none;
  letter-spacing: 0;
}

/* Root-cause back-link inside a proposal card — shows which named cluster
   the proposal is closing. Clicking jumps to the diagnosis row above. */
.proposal-card .proposal-rootcauses {
  margin-top: 8px;
  font-size: var(--text-xs);
  color: var(--fg-3);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.proposal-card .proposal-rootcauses .label {
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-4);
  margin-right: 2px;
}
.proposal-card .proposal-rootcauses a {
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px dashed currentColor;
  padding-bottom: 1px;
}
.proposal-card .proposal-rootcauses a:hover { border-bottom-style: solid; }

/* addresses_fails chips become anchor links jumping to the underlying
   fail card. Visual treatment matches the original chip; the hover affordance
   tells the reader they can click. */
.proposal-card .proposal-addresses a.chip {
  text-decoration: none;
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease),
              border-color var(--motion-fast) var(--ease);
}
.proposal-card .proposal-addresses a.chip:hover {
  background: var(--accent-bg);
  border-color: var(--accent-bd);
  color: var(--accent);
}

/* Reverse link on a fail card: a small badge that points back at the
   proposal addressing this fail. Closes the loop in the other direction. */
.fail-card .fc-proposal-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  padding: 2px 8px;
  border-radius: 3px;
  text-decoration: none;
  margin-left: 8px;
  white-space: nowrap;
  vertical-align: middle;
}
.fail-card .fc-proposal-link:hover { background: var(--accent); color: white; }

/* fail cards become anchor targets for proposal → fail jumps */
.fail-card { scroll-margin-top: 80px; }
.fail-card.target-flash {
  animation: target-flash 1.4s var(--ease);
}
@keyframes target-flash {
  0%   { box-shadow: 0 0 0 0 var(--accent-bd); }
  20%  { box-shadow: 0 0 0 6px var(--accent-bd); }
  100% { box-shadow: 0 0 0 0 transparent; }
}

/* ─── action required (info hierarchy L2 — fix these first) */
.action-section {
  margin-bottom: 48px;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  font-size: var(--text-sm);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
}
.section-head .badge {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--fg-1);
  padding: 2px 8px;
  border-radius: 4px;
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
}
.section-head.action {
  color: var(--fail);
}
.section-head.action .icon {
  color: var(--fail);
}
.section-head.action .badge {
  background: var(--fail-bg);
  border-color: var(--fail-bd);
  color: var(--fail);
}
.section-head .head-tag {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--fg-3);
  text-transform: none;
  letter-spacing: 0;
}
.section-head.risk {
  color: var(--warn);
}
.section-head.risk .icon {
  color: var(--warn);
}
.section-head.risk .badge {
  background: var(--warn-bg);
  border-color: var(--warn-bd);
  color: var(--warn);
}

/* subtype subsection within failures */
.subtype-block {
  margin-bottom: 24px;
}
.subtype-block .subtype-block-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 10px;
  padding: 10px 4px 8px;
  border-bottom: 1px solid var(--border-default);
  font-size: var(--text-base);
  letter-spacing: -0.005em;
  color: var(--fg-1);
  font-weight: 500;
}
.subtype-block .subtype-block-head .subtype-name {
  color: var(--fg-0);
}
.subtype-block .subtype-block-head .subtype-count {
  margin-left: auto;
  color: var(--fg-3);
  font-weight: 400;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
/* fail card — full information visible without click */
.fail-card {
  background: var(--surface-card);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 22px 26px;
  margin-bottom: 12px;
  transition: transform var(--motion-fast) var(--ease),
              border-color var(--motion-fast) var(--ease);
}
/* Severity is expressed entirely by the .fc-sev pill (colored text +
   matching border + tinted background). No left stripe, no background
   gradient — those read as Bootstrap-alert stock chrome; the pill is
   enough signal and reads as an editorial label instead. */
.fail-card:hover {
  border-color: var(--border-strong);
  transform: translateY(-1px);
}

.fail-card .fc-top {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}
.fail-card .fc-sev {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid;
  flex-shrink: 0;
  margin-top: 2px;
}
.fail-card.critical .fc-sev {
  color: var(--fail);
  border-color: var(--fail);
  background: var(--fail-bg);
}
.fail-card.major .fc-sev {
  color: var(--fail);
  border-color: var(--fail-bd);
  background: var(--fail-bg);
}
.fail-card.minor .fc-sev {
  color: var(--warn);
  border-color: var(--warn-bd);
  background: var(--warn-bg);
}
.fail-card .fc-title {
  flex: 1;
  min-width: 0;
}
.fail-card .fc-name {
  font-size: 17px;
  font-weight: 500;
  color: var(--fg-0);
  letter-spacing: -0.01em;
  line-height: 1.3;
  margin-bottom: 3px;
}
.fail-card .fc-id {
  font-size: var(--text-sm);
  color: var(--fg-3);
}
.fail-card .fc-meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  flex-shrink: 0;
  margin-top: 4px;
  max-width: 36ch;
}
.meta-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--fg-2);
  font-size: var(--text-sm);
  line-height: 1;
  white-space: nowrap;
}
.meta-pill.band-ux {
  background: var(--pass-bg);
  border-color: var(--pass-bd);
  color: var(--pass);
}
.meta-pill.band-ui-risk {
  background: var(--warn-bg);
  border-color: var(--warn-bd);
  color: var(--warn);
}
.meta-pill.subtype {
  background: var(--bg-3);
  color: var(--fg-1);
}
.meta-pill.method {
  font-family: "Geist Mono", ui-monospace, monospace;
}

/* the verdict — what's wrong, in plain language */
.fail-card .fc-verdict {
  font-size: 14.5px;
  line-height: 1.6;
  color: var(--fg-1);
  margin-bottom: 14px;
  max-width: 78ch;
}

/* L4 journey_evaluation — 4-axis verdict block, only on primary-journey
   fail cards. Sits between fc-verdict and fc-fix so the structured rollup
   is visible at a glance, before the suggestion. The block is always
   expanded; only the per-step excise breakdown is collapsed. */
.fail-card .fc-journey-eval {
  margin: 4px 0 14px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  background: var(--surface-card);
  overflow: hidden;
}
.fail-card .fc-journey-eval .fje-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 10px 14px 6px;
}
.fail-card .fc-journey-eval .fje-head .fje-label {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
}
.fail-card .fc-journey-eval .fje-head .fje-sub {
  font-size: var(--text-xs);
  color: var(--fg-4);
}
.fail-card .fc-journey-eval .fje-axis {
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 4px 12px;
  align-items: baseline;
}
.fail-card .fc-journey-eval .fje-axis:first-of-type {
  border-top: 1px solid var(--line-2);
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--fg-1);
  line-height: 1.4;
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-verdict {
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 1px 7px;
  border-radius: 3px;
  white-space: nowrap;
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-verdict.pass {
  color: var(--pass);
  background: var(--pass-bg);
  border: 1px solid var(--pass-bd);
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-verdict.fail {
  color: var(--fail);
  background: var(--fail-bg);
  border: 1px solid var(--fail-bd);
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-verdict.skipped {
  color: var(--fg-3);
  background: var(--bg-2);
  border: 1px solid var(--line-2);
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-verdict.unverifiable {
  color: var(--fg-2);
  background: var(--bg-2);
  border: 1px dashed var(--line-2);
}
.fail-card .fc-journey-eval .fje-axis .fje-axis-evidence {
  grid-column: 1 / -1;
  font-size: var(--text-sm);
  line-height: 1.55;
  color: var(--fg-2);
  margin-top: 2px;
}
.fail-card .fc-journey-eval .fje-axis .fje-cost-stats {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.fail-card .fc-journey-eval .fje-axis .fje-stat {
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 3px;
  padding: 2px 7px;
  color: var(--fg-2);
}
.fail-card .fc-journey-eval .fje-axis .fje-stat.bad {
  color: var(--fail);
  border-color: var(--fail-bd);
  background: var(--fail-bg);
}
.fail-card .fc-journey-eval .fje-axis .fje-stat.intentional {
  color: var(--fg-1);
  border-color: var(--line);
  background: var(--bg-1);
}
.fail-card .fc-journey-eval .fje-excise-toggle {
  grid-column: 1 / -1;
  background: none;
  border: none;
  padding: 6px 0 0;
  margin: 0;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--fg-3);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.fail-card .fc-journey-eval .fje-excise-toggle:hover { color: var(--fg-1); }
.fail-card .fc-journey-eval .fje-excise-list {
  grid-column: 1 / -1;
  margin-top: 8px;
  display: none;
}
.fail-card .fc-journey-eval .fje-excise-list.open { display: block; }
.fail-card .fc-journey-eval .fje-excise-list ol {
  margin: 0;
  padding-left: 0;
  list-style: none;
}
.fail-card .fc-journey-eval .fje-excise-list li {
  display: grid;
  grid-template-columns: 70px 90px 1fr;
  gap: 8px;
  align-items: baseline;
  padding: 4px 0;
  border-top: 1px dashed var(--line);
  font-size: var(--text-xs);
}
.fail-card .fc-journey-eval .fje-excise-list li:first-child { border-top: none; }
.fail-card .fc-journey-eval .fje-excise-list .fje-step-num {
  font-family: 'Geist Mono', monospace;
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.fail-card .fc-journey-eval .fje-excise-list .fje-kind {
  font-family: 'Geist Mono', monospace;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
}
.fail-card .fc-journey-eval .fje-excise-list .fje-kind.intentional { color: var(--fg-2); }
.fail-card .fc-journey-eval .fje-excise-list .fje-kind.unintentional { color: var(--fail); }
.fail-card .fc-journey-eval .fje-excise-list .fje-rationale {
  color: var(--fg-2);
  line-height: 1.5;
}

/* the suggestion — accent block, always visible */
.fail-card .fc-fix {
  background: var(--accent-bg);
  border: 1px solid var(--accent-bd);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 12px;
}
.fail-card .fc-fix .icon {
  color: var(--accent);
  flex-shrink: 0;
  margin-top: 2px;
}
.fail-card .fc-fix .fc-fix-body {
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--fg-1);
}
.fail-card .fc-fix .fc-fix-body strong {
  color: var(--fg-0);
  font-weight: 500;
  display: block;
  margin-bottom: 2px;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* expand toggle for evidence */
.fail-card .fc-toggle {
  background: none;
  border: none;
  color: var(--fg-3);
  font-size: var(--text-xs);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 0;
  min-height: 30px;
  cursor: pointer;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.fail-card .fc-toggle:hover { color: var(--fg-0); }
.fail-card .fc-toggle .icon { width: 12px; height: 12px; transition: transform 0.16s ease; }
.fail-card.open .fc-toggle .icon { transform: rotate(90deg); }
.fail-card .fc-evidence {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line-2);
}
.fail-card.open .fc-evidence { display: block; }
.fail-card .fc-evidence dl {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 6px 18px;
  margin-bottom: 14px;
}
.fail-card .fc-evidence dt {
  font-size: var(--text-xs);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--fg-3);
}
.fail-card .fc-evidence dd {
  font-size: var(--text-sm);
  line-height: 1.55;
  color: var(--fg-1);
  max-width: 75ch;
}
.fail-card .fc-matches {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  border-left: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px 16px;
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: 11.5px;
  color: var(--fg-1);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 240px;
  overflow-y: auto;
  line-height: 1.55;
}
.fail-card .fc-matches .m-row { padding: 5px 0; border-bottom: 1px solid var(--line); }
.fail-card .fc-matches .m-row:last-child { border-bottom: none; }
.fail-card .fc-matches .m-tag { color: var(--accent); font-weight: 500; margin-right: 8px; }

/* visual evidence — what the judge actually saw */
.fail-card .fc-visual { margin-top: 14px; }
.fail-card .fc-visual-head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg-3);
  margin-bottom: 8px;
}
.fail-card .fc-visual-head .icon { width: 12px; height: 12px; }
.fail-card .fc-visual-owner {
  font-family: "Geist Mono", monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  text-transform: none;
  letter-spacing: 0;
}
.fail-card .fc-visual-count {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
  color: var(--fg-3);
  font-weight: 400;
  background: var(--bg-3);
  border: 1px solid var(--line);
  padding: 1px 7px;
  border-radius: 4px;
  text-transform: none;
  letter-spacing: 0;
}
.fail-card .fc-shots {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 164px;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) var(--bg-1);
  padding-bottom: 6px;
}
.fail-card .fc-shots::-webkit-scrollbar { height: 6px; }
.fail-card .fc-shots::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
.fail-card .fc-shots[data-many="true"] { grid-auto-columns: 148px; }
.fail-card .fc-shot {
  scroll-snap-align: start;
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.fail-card .fc-shot button {
  display: block;
  background: var(--bg-3);
  line-height: 0;
  width: 100%;
  border: none;
  padding: 0;
  text-align: left;
}
.fail-card .fc-shot img {
  width: 100%;
  height: 96px;
  object-fit: cover;
  object-position: top center;
  display: block;
  transition: transform 0.2s ease;
}
.fail-card .fc-shot:hover img { transform: scale(1.02); }
.fail-card .fc-shot-more {
  min-height: 96px;
  display: grid;
  place-items: center;
  color: var(--fg-2);
  font-size: var(--text-sm);
  font-weight: 500;
  background: linear-gradient(180deg, var(--bg-2), var(--bg-3));
}
.fail-card .fc-shot figcaption {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  font-size: var(--text-sm);
  border-top: 1px solid var(--line);
  background: var(--bg-2);
}
.fail-card .fc-shot .fc-shot-step {
  font-family: "Geist Mono", monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
  font-variant-numeric: tabular-nums;
}
.fail-card .fc-shot .fc-shot-name {
  color: var(--fg-1);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fail-card .fc-video {
  width: 100%;
  max-width: 720px;
  margin-top: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: #000;
  display: block;
}

/* ─── lightbox for evidence screenshots ─────────────────── */
.lightbox {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 120;
}
.lightbox.open { display: block; }
.lightbox .lb-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 8, 12, 0.82);
  backdrop-filter: blur(4px);
}
.lightbox .lb-dialog {
  position: absolute;
  inset: 28px;
  border-radius: 16px;
  border: 1px solid var(--line-2);
  background: var(--bg-1);
  box-shadow: var(--shadow-md);
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}
.lightbox .lb-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.lightbox .lb-title {
  font-size: var(--text-sm);
  color: var(--fg-2);
  min-width: 0;
}
.lightbox .lb-owner {
  font-family: "Geist Mono", monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
}
.lightbox .lb-spacer { flex: 1; }
.lightbox .lb-close {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-1);
}
.lightbox .lb-close svg { width: 18px; height: 18px; }
.lightbox .lb-close:hover { background: var(--bg-3); color: var(--fg-0); }
.lightbox .lb-stage {
  display: grid;
  place-items: center;
  background: #0a0a0a;
  overflow: auto;
  padding: 18px;
}
.lightbox .lb-stage img {
  max-width: 100%;
  max-height: calc(100vh - 220px);
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #111111;
}
.lightbox .lb-stage .lb-video {
  max-width: 100%;
  max-height: calc(100vh - 220px);
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #000;
}
.lightbox .lb-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  border-top: 1px solid var(--line);
}
.lightbox .lb-meta {
  font-size: var(--text-sm);
  color: var(--fg-2);
  min-width: 0;
}
.lightbox .lb-nav {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-1);
}
.lightbox .lb-nav svg { width: 18px; height: 18px; }
.lightbox .lb-nav:hover { background: var(--bg-3); color: var(--fg-0); }
.lightbox .lb-nav[disabled] {
  opacity: 0.4;
  cursor: default;
}

/* ─── asset sheet for row-level evidence ────────────────── */
.asset-sheet {
  position: fixed;
  inset: 0;
  display: none;
  z-index: 110;
}
.asset-sheet.open { display: block; }
.asset-sheet .as-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 8, 12, 0.72);
  backdrop-filter: blur(4px);
}
.asset-sheet .as-dialog {
  position: absolute;
  inset: 40px 56px;
  border-radius: 16px;
  border: 1px solid var(--line-2);
  background: var(--bg-1);
  box-shadow: var(--shadow-md);
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}
.asset-sheet .as-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
}
.asset-sheet .as-title {
  font-size: var(--text-sm);
  color: var(--fg-1);
  min-width: 0;
}
.asset-sheet .as-owner {
  font-family: "Geist Mono", monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
}
.asset-sheet .as-spacer { flex: 1; }
.asset-sheet .as-close {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-1);
}
.asset-sheet .as-close svg { width: 18px; height: 18px; }
.asset-sheet .as-close:hover { background: var(--bg-3); color: var(--fg-0); }
.asset-sheet .as-body {
  overflow: auto;
  padding: 18px;
}
.asset-sheet .as-body .fc-visual {
  margin-top: 0;
}

/* ─── all issues — collapsed wrapper around the raw fail cards.
       This is the "secondary" view; Suggested fixes (Top fixes) is the
       primary view. Open this when the synthesized proposals don't cover
       what you need. */
details.all-issues {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-6);
  overflow: hidden;
}
details.all-issues > summary {
  list-style: none;
  cursor: pointer;
  padding: var(--space-4) var(--space-5);
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: var(--text-base);
  color: var(--fg-1);
  user-select: none;
  font-weight: 500;
}
details.all-issues > summary::-webkit-details-marker { display: none; }
details.all-issues > summary:hover { background: var(--bg-2); }
details.all-issues > summary .chev {
  color: var(--fg-3);
  display: inline-flex;
  transition: transform 0.16s ease;
  width: 14px;
  height: 14px;
}
details.all-issues[open] > summary .chev { transform: rotate(90deg); }
details.all-issues > summary .ai-label {
  color: var(--fg-0);
  font-weight: 600;
  letter-spacing: -0.01em;
}
details.all-issues > summary .ai-count {
  background: var(--fail-bg);
  border: 1px solid var(--fail-bd);
  color: var(--fail);
  padding: 2px 8px;
  border-radius: 4px;
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
  font-weight: 600;
}
details.all-issues > summary .ai-hint {
  margin-left: auto;
  color: var(--fg-3);
  font-size: var(--text-xs);
  font-weight: 400;
  max-width: 60ch;
  text-align: right;
  line-height: 1.4;
}
details.all-issues > .ai-body {
  padding: var(--space-2) var(--space-5) var(--space-5);
  border-top: 1px solid var(--line);
}
details.all-issues > .ai-body .action-section { margin-bottom: var(--space-5); }
details.all-issues > .ai-body .action-section:last-child { margin-bottom: 0; }

/* ─── secondary sections (passing / skipped / sources) — collapsed ─── */
details.collap {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 12px;
  overflow: hidden;
}
details.collap summary {
  list-style: none;
  cursor: pointer;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--fg-2);
  user-select: none;
  font-weight: 500;
}
details.collap summary::-webkit-details-marker { display: none; }
details.collap summary:hover { background: var(--bg-2); }
details.collap summary .chev {
  color: var(--fg-3);
  display: inline-flex;
  transition: transform 0.16s ease;
  width: 14px;
  height: 14px;
}
details.collap[open] summary .chev { transform: rotate(90deg); }
details.collap summary .badge {
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  color: var(--fg-1);
  padding: 2px 8px;
  border-radius: 4px;
  font-variant-numeric: tabular-nums;
  font-size: var(--text-xs);
  margin-left: auto;
}
details.collap .collap-body {
  padding: 8px 24px 22px;
  border-top: 1px solid var(--line);
}
details.collap .collap-note {
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-2);
  border-left: 2px solid var(--accent);
  padding: 10px 14px;
  margin: 12px 0 16px;
  border-radius: 0 4px 4px 0;
  line-height: 1.5;
}
details.collap .compact-row {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 14px;
  padding: 14px 0;
  align-items: start;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
}
details.collap .compact-row:last-child { border-bottom: none; }
details.collap .compact-row .si {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
details.collap .compact-row .si svg { width: 10px; height: 10px; stroke-width: 2.5; }
details.collap .compact-row.pass .si { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
details.collap .compact-row.skipped .si { background: var(--skip-bg); color: var(--skip); border: 1px solid var(--skip-bd); }
details.collap .compact-row .nm {
  color: var(--fg-1);
  font-weight: 500;
  font-size: 13.5px;
  line-height: 1.4;
}
details.collap .compact-row .id-sub { color: var(--fg-3); font-size: 11.5px; margin-top: 2px; }
details.collap .compact-row .compact-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
}
details.collap .compact-row .compact-summary {
  color: var(--fg-2);
  font-size: var(--text-sm);
  line-height: 1.6;
  margin-top: 9px;
  max-width: 84ch;
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
details.collap .compact-row .compact-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  min-height: 100%;
}
details.collap .compact-row .action-buttons {
  display: inline-flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}
details.collap .compact-row .asset-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  min-height: 30px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--fg-2);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
}
details.collap .compact-row .asset-btn:hover {
  background: var(--bg-3);
  color: var(--fg-0);
}
details.collap .compact-row .asset-btn .icon {
  width: 12px;
  height: 12px;
}
details.collap .compact-row .detail-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 12px;
  min-height: 30px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg-2);
  font-size: var(--text-xs);
  font-weight: 500;
}
details.collap .compact-row .detail-btn:hover {
  background: var(--bg-2);
  color: var(--fg-0);
}
details.collap .compact-row .compact-detail {
  display: none;
  margin-top: 10px;
  padding: 12px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  max-width: 84ch;
}
details.collap .compact-row.open .compact-detail {
  display: block;
}
details.collap .compact-row.open .compact-summary {
  -webkit-line-clamp: unset;
  overflow: visible;
}
details.collap .compact-row .compact-detail-text {
  color: var(--fg-1);
  font-size: var(--text-sm);
  line-height: 1.65;
}
details.collap .compact-row .compact-detail-matches {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}
details.collap .compact-row .compact-detail-matches .mchip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--fg-2);
  font-size: var(--text-sm);
}
details.collap .compact-row .compact-detail-matches .mchip strong {
  color: var(--fg-0);
  font-weight: 500;
}
.compact-group {
  margin-top: 14px;
}
.compact-group:first-child {
  margin-top: 0;
}
.compact-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 8px;
}
.compact-group-head .name {
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--fg-1);
}
.compact-group-head .desc {
  font-size: var(--text-sm);
  color: var(--fg-3);
}
.compact-group-head .count {
  margin-left: auto;
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-3);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 8px;
}

/* ─── fix queue — checkbox + sticky bottom bar + toast
       The dashboard is a work queue: user checks items, clicks "Copy
       fix prompt", pastes into the next coding-agent turn. Keeps the
       interaction simple — no filesystem, no backend, just clipboard. */
.fix-check-wrap {
  position: absolute;
  top: var(--space-4);
  right: var(--space-4);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  cursor: pointer;
  z-index: 3;
  background: transparent;
  border: none;
}
.fix-check-wrap input[type="checkbox"] {
  margin: 0;
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
  cursor: pointer;
}
/* proposal cards need explicit position:relative for absolute child */
.proposal-card { position: relative; }
/* add right padding so title text doesn't run under the checkbox */
.proposal-card .proposal-title { padding-right: 38px; }
.fail-card { position: relative; }
.fail-card .fc-top { padding-right: 38px; }
/* Focus-visible styling comes from the universal focus rule */

/* sticky bottom bar — hidden until at least one item is checked */
.fix-bar {
  position: fixed;
  bottom: var(--space-5);
  left: 50%;
  transform: translate(-50%, 140%);
  background: var(--surface-card);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  padding: 10px 12px 10px 20px;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45),
              0 4px 12px rgba(0, 0, 0, 0.25);
  z-index: 100;
  transition: transform var(--motion-slow) var(--ease),
              opacity var(--motion-slow) var(--ease);
  opacity: 0;
  pointer-events: none;
  font-size: var(--text-sm);
}
.fix-bar.open {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}
.fix-bar .fix-bar-inner {
  display: flex;
  align-items: center;
  gap: 14px;
}
.fix-bar .fix-bar-count {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
  min-width: 20px;
  text-align: right;
}
.fix-bar .fix-bar-label {
  color: var(--fg-3);
  font-size: var(--text-sm);
}
.fix-bar .fix-bar-copy {
  background: var(--accent);
  color: var(--accent-fg);
  border: none;
  padding: 9px 18px;
  border-radius: 999px;
  font: inherit;
  font-weight: 500;
  font-size: var(--text-sm);
  cursor: pointer;
  transition: filter var(--motion-base) var(--ease),
              transform var(--motion-base) var(--ease);
  min-height: 36px;
}
.fix-bar .fix-bar-copy:hover { filter: brightness(1.08); }
.fix-bar .fix-bar-copy:active { transform: scale(0.97); }
.fix-bar .fix-bar-clear {
  background: transparent;
  color: var(--fg-3);
  border: none;
  padding: 9px 14px;
  font: inherit;
  font-size: var(--text-sm);
  cursor: pointer;
  border-radius: 999px;
  transition: color var(--motion-base) var(--ease),
              background var(--motion-base) var(--ease);
  min-height: 36px;
}
.fix-bar .fix-bar-clear:hover {
  color: var(--fg-0);
  background: var(--bg-3);
}

/* toast for copy confirmation */
.toast {
  position: fixed;
  bottom: calc(var(--space-5) + 64px);
  left: 50%;
  transform: translate(-50%, 8px);
  background: var(--bg-3);
  color: var(--fg-0);
  border: 1px solid var(--border-default);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: var(--text-sm);
  line-height: 1.5;
  max-width: min(520px, calc(100vw - 32px));
  text-align: center;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
  opacity: 0;
  pointer-events: none;
  z-index: 200;
  transition: opacity var(--motion-base) var(--ease),
              transform var(--motion-base) var(--ease);
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* narrow viewport: shrink bar padding but keep hit targets */
@media (max-width: 640px) {
  .fix-bar {
    left: var(--space-4);
    right: var(--space-4);
    transform: translateY(140%);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .fix-bar.open { transform: translateY(0); }
}

/* Compare bar — same pattern as fix bar but uses a different accent
   and stacks above the fix bar if both happen to be open. */
.compare-bar {
  /* inherits .fix-bar */
}
.compare-bar .fix-bar-copy:disabled,
.compare-bar .compare-bar-go:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  filter: none;
}
.compare-bar .fix-bar-copy:disabled:active {
  transform: none;
}
/* library card checkbox placement — top-right, tucked under the
   archived/missing badge slot. Only rendered for live cards, so no
   overlap with the badge in practice. */
.lib-card > .compare-check-wrap {
  top: var(--space-3);
  right: var(--space-3);
}
/* nudge the pass rate left so the checkbox doesn't overlap it */
.lib-card .lib-card-head { padding-right: 36px; }

/* compare-back-link in the Compare header when sourced from Library */
.compare-back-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  transition: color var(--motion-base) var(--ease);
}
.compare-back-link:hover { text-decoration: underline; }
.meta-line .meta-sep { color: var(--fg-4); margin: 0 4px; }

/* ─── audit layout — main column + sticky aside (screenshot panel)
       Used at desktop widths so the captured target stays in view while
       the user scrolls through suggested fixes / all issues / passing.
       Falls back to single-column at narrower viewports.

       The .audit-main column gets min-width: 0 so its grid children (which
       contain pre/code blocks, long URLs, etc.) can shrink instead of
       blowing the whole layout horizontally.                          */
.audit-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: var(--space-7);
  margin-top: var(--space-2);
}
.audit-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.audit-aside {
  position: sticky;
  top: 76px; /* topbar height + small breathing room */
  align-self: start;
  height: fit-content;
}
.audit-aside .aside-card {
  background:
    linear-gradient(var(--surface-card), var(--surface-card)) padding-box,
    var(--card-edge) border-box,
    var(--border-default) border-box;
  border: 1px solid transparent;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.audit-aside .aside-shot {
  display: block;
  width: 100%;
  background: var(--surface-input);
  cursor: zoom-in;
  border: none;
  padding: 0;
  line-height: 0;
  position: relative;
  overflow: hidden;
}
.audit-aside .aside-shot img {
  width: 100%;
  display: block;
  max-height: 280px;
  object-fit: cover;
  object-position: top center;
  transition: transform var(--motion-base) var(--ease);
}
.audit-aside .aside-shot:hover img { transform: scale(1.015); }
.audit-aside .aside-shot::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.04) inset;
}
.audit-aside .aside-meta {
  padding: var(--space-4) var(--space-5);
  border-top: 1px solid var(--border-default);
}
.audit-aside .aside-meta h3 {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-meta);
  margin-bottom: var(--space-3);
}
.audit-aside .aside-meta dl {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
}
.audit-aside .aside-meta dt {
  color: var(--text-meta);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.audit-aside .aside-meta dd {
  color: var(--text-primary);
  word-break: break-all;
  font-variant-numeric: tabular-nums;
}
.audit-aside .aside-meta dd a { color: var(--text-primary); }
.audit-aside .aside-meta dd a:hover { color: var(--accent); }
.audit-aside .aside-meta .totals {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-3);
  border-top: 1px solid var(--border-default);
}
.audit-aside .aside-meta .totals .pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  border: 1px solid var(--border-default);
  background: var(--surface-elev);
}
.audit-aside .aside-meta .totals .pill.pass { color: var(--pass); border-color: var(--pass-bd); background: var(--pass-bg); }
.audit-aside .aside-meta .totals .pill.fail { color: var(--fail); border-color: var(--fail-bd); background: var(--fail-bg); }
.audit-aside .aside-meta .totals .pill.skip { color: var(--skip); border-color: var(--skip-bd); background: var(--skip-bg); }

/* Collapse to single column when there's not enough horizontal room.
   Below this width the aside un-stickies and falls underneath the main
   content (where the old context-strip used to live). */
@media (max-width: 1180px) {
  .audit-layout {
    grid-template-columns: minmax(0, 1fr);
    gap: var(--space-5);
  }
  .audit-aside {
    position: static;
    top: auto;
  }
  .audit-aside .aside-shot img { max-height: 220px; }
}

/* context strip — screenshot in a smaller, peripheral position */
.context-strip {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 28px;
  margin-bottom: 44px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  align-items: stretch;
}
.context-strip .ctx-img {
  background: var(--bg-3);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  overflow: hidden;
}
.context-strip .ctx-img img {
  width: 100%;
  display: block;
  max-height: 220px;
  object-fit: cover;
  object-position: top center;
}
.context-strip .ctx-meta {
  padding: 24px 26px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
}
.context-strip .ctx-meta h3 {
  font-size: var(--text-sm);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-3);
  margin-bottom: 4px;
}
.context-strip .ctx-meta dl {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 6px 14px;
  font-size: 13px;
}
.context-strip .ctx-meta dt {
  color: var(--fg-3);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.context-strip .ctx-meta dd { color: var(--fg-1); word-break: break-all; }
.context-strip .ctx-meta dd a { color: var(--fg-1); }
.context-strip .ctx-meta dd a:hover { color: var(--accent); }

/* ─── timeline strip — horizontal scroll for many iterations ─── */
.timeline-strip {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(140px, 1fr);
  margin-bottom: 36px;
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) var(--bg-1);
}
.timeline-strip::-webkit-scrollbar { height: 8px; }
.timeline-strip::-webkit-scrollbar-track { background: var(--bg-1); }
.timeline-strip::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.timeline-strip .stop {
  scroll-snap-align: start;
  min-width: 140px;
}
/* Cap visible iterations at ~7; rest scroll */
.timeline-strip[data-many="true"] {
  grid-auto-columns: 160px;
}
.timeline-strip .stop {
  text-align: left;
  cursor: pointer;
  padding: 18px 20px;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: background 0.12s ease;
}
.timeline-strip .stop:last-child { border-right: none; }
.timeline-strip .stop:hover { background: var(--bg-2); }
.timeline-strip .stop.active { background: var(--bg-3); }
.timeline-strip .stop .iter {
  font-size: var(--text-xs);
  color: var(--fg-3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.timeline-strip .stop .rate {
  font-size: 32px;
  font-weight: 500;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}
.timeline-strip .stop .rate.high { color: var(--pass); }
.timeline-strip .stop .rate.mid { color: var(--warn); }
.timeline-strip .stop .rate.low { color: var(--fail); }
.timeline-strip .stop .delta {
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  color: var(--fg-3);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.timeline-strip .stop .delta.up { color: var(--pass); }
.timeline-strip .stop .delta.down { color: var(--fail); }
.timeline-strip .stop .delta .icon { width: 11px; height: 11px; }
.timeline-strip .stop .scenario {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  font-size: var(--text-xs);
  line-height: 1;
  padding: 4px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--fg-2);
  background: var(--bg-2);
  white-space: nowrap;
}
.timeline-strip .stop .scenario.locked {
  color: var(--pass);
  border-color: var(--pass-bd);
  background: var(--pass-bg);
}
.timeline-strip .stop .scenario.refresh {
  color: var(--warn);
  border-color: var(--warn-bd);
  background: var(--warn-bg);
}
.timeline-strip .stop .scenario.hybrid {
  color: var(--accent);
  border-color: var(--accent-bd);
  background: var(--accent-bg);
}

/* ─── compare apps — scroll for >4 apps ─── */
.compare-apps {
  display: grid;
  gap: 12px;
  margin-bottom: 32px;
}
.compare-apps[data-many="true"] {
  display: flex;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--line-2) var(--bg-1);
  scroll-snap-type: x mandatory;
  padding-bottom: 6px;
}
.compare-apps[data-many="true"]::-webkit-scrollbar { height: 8px; }
.compare-apps[data-many="true"]::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
.compare-apps[data-many="true"] .app {
  min-width: 280px;
  scroll-snap-align: start;
}
.compare-apps .app {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.12s ease;
}
.compare-apps .app:hover { border-color: var(--line-2); }
.compare-apps .app .name {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.025em;
  line-height: 1.05;
  color: var(--fg-0);
}
.compare-apps .app .url {
  font-size: var(--text-xs);
  color: var(--fg-3);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  word-break: break-all;
}
.compare-apps .app .rate {
  font-size: 56px;
  font-weight: 500;
  line-height: 0.9;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  margin-top: 4px;
}
.compare-apps .app .rate.high { color: var(--pass); }
.compare-apps .app .rate.mid { color: var(--warn); }
.compare-apps .app .rate.low { color: var(--fail); }
.compare-apps .app .stats {
  font-size: var(--text-sm);
  display: flex;
  gap: 18px;
  color: var(--fg-3);
}
.compare-apps .app .stats .pass-st { color: var(--pass); }
.compare-apps .app .stats .fail-st { color: var(--fail); }
.compare-apps .app img.thumb {
  width: 100%;
  margin-top: 8px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-3);
  max-height: 180px;
  object-fit: cover;
  object-position: top center;
}

/* compare matrix */
.compare-matrix {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 56px;
  overflow-x: auto;
}
.compare-matrix table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.compare-matrix thead th {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 14px 18px;
  text-align: left;
  font-size: var(--text-xs);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--fg-2);
  white-space: nowrap;
}
.compare-matrix thead th.app-col {
  text-align: center;
  min-width: 130px;
}
.compare-matrix tbody td {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.compare-matrix tbody tr:last-child td { border-bottom: none; }
.compare-matrix tbody tr.cat-row td {
  background: var(--bg-2);
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-2);
  padding: 11px 18px;
}
.compare-matrix .check-name {
  font-weight: 500;
  color: var(--fg-0);
}
.compare-matrix .check-id {
  font-size: var(--text-xs);
  color: var(--fg-3);
  margin-top: 2px;
}
.compare-matrix .source-cite {
  font-size: var(--text-xs);
  color: var(--accent);
  margin-top: 4px;
}
.compare-matrix td.cell {
  text-align: center;
}
.compare-matrix td.cell .status-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.compare-matrix td.cell .status-icon svg { width: 14px; height: 14px; stroke-width: 2.4; }
.compare-matrix td.cell.pass { background: rgba(74, 222, 128, 0.04); }
.compare-matrix td.cell.pass .status-icon { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
.compare-matrix td.cell.fail { background: rgba(251, 113, 133, 0.04); }
.compare-matrix td.cell.fail .status-icon { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-bd); }
.compare-matrix td.cell.skipped .status-icon { background: var(--skip-bg); color: var(--skip); border: 1px solid var(--skip-bd); }
.compare-matrix td.cell .small {
  display: block;
  font-size: var(--text-xs);
  color: var(--fg-3);
  margin-top: 6px;
  line-height: 1.45;
  max-width: 22ch;
  margin-left: auto;
  margin-right: auto;
}

/* ─── TIMELINE delta view (action-first) ─────────────────── */
/* The delta view answers "what should I do next?" first, then lets
   the user explore. Built from buildIterationMatrix + classifyChange.
   Reuses compare-matrix's table styling for the bottom matrix. */

/* Action panel — 1-3 most-actionable items, shown as cards. Each card
   has an archetype chip (regressed/persistent/etc), the check name,
   a 1-line "what to do", and a button that scrolls to the row. */
.delta-action-panel {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.delta-action-card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  transition: border-color var(--motion-fast) var(--ease),
              transform var(--motion-fast) var(--ease);
  cursor: pointer;
}
.delta-action-card:hover {
  border-color: var(--line-2);
  transform: translateY(-1px);
}
.delta-action-card[data-archetype="regressed"] { border-left: 3px solid var(--fail); }
.delta-action-card[data-archetype="new-fail"] { border-left: 3px solid var(--fail); }
.delta-action-card[data-archetype="persistent-fail"] { border-left: 3px solid var(--warn); }
.delta-action-card[data-archetype="flapping"] { border-left: 3px solid var(--warn); }
.delta-action-card[data-archetype="fixed"] { border-left: 3px solid var(--pass); }
.delta-action-card[data-archetype="new-pass"] { border-left: 3px solid var(--pass); }

.delta-action-card .ac-head {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
}
.delta-action-card[data-archetype="regressed"] .ac-head,
.delta-action-card[data-archetype="new-fail"] .ac-head { color: var(--fail); }
.delta-action-card[data-archetype="persistent-fail"] .ac-head,
.delta-action-card[data-archetype="flapping"] .ac-head { color: var(--warn); }
.delta-action-card[data-archetype="fixed"] .ac-head,
.delta-action-card[data-archetype="new-pass"] .ac-head { color: var(--pass); }

.delta-action-card .ac-name {
  font-size: var(--text-md);
  font-weight: 500;
  color: var(--fg-0);
  letter-spacing: -0.01em;
  line-height: 1.35;
}
.delta-action-card .ac-id {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
}
.delta-action-card .ac-advice {
  font-size: var(--text-sm);
  color: var(--fg-2);
  line-height: 1.5;
}
.delta-action-card .ac-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: var(--text-xs);
  color: var(--fg-3);
  margin-top: 2px;
}
.delta-action-card .ac-foot .ac-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
}

/* Counter strip — at-a-glance scoreboard, 4 numbers. */
.delta-counters {
  display: flex;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 24px;
}
.delta-counters .dc {
  flex: 1;
  background: var(--bg-1);
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.delta-counters .dc .n {
  font-size: var(--text-xl);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1;
}
.delta-counters .dc .l {
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--fg-3);
