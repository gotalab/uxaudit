  font-weight: 500;
}
.delta-counters .dc.fixed .n      { color: var(--pass); }
.delta-counters .dc.regressed .n  { color: var(--fail); }
.delta-counters .dc.persistent .n { color: var(--warn); }
.delta-counters .dc.new .n        { color: var(--accent); }

/* Filter chips — pill toggle group for the matrix below. */
.delta-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
.delta-filters .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-1);
  color: var(--fg-2);
  font-size: var(--text-sm);
  cursor: pointer;
  transition: all var(--motion-fast) var(--ease);
  font-variant-numeric: tabular-nums;
}
.delta-filters .chip:hover {
  border-color: var(--line-2);
  color: var(--fg-1);
}
.delta-filters .chip.active {
  background: var(--bg-3);
  border-color: var(--line-2);
  color: var(--fg-0);
}
.delta-filters .chip .count {
  font-size: var(--text-xs);
  color: var(--fg-3);
  background: var(--bg-2);
  padding: 1px 6px;
  border-radius: 999px;
}
.delta-filters .chip.active .count {
  background: var(--bg-1);
  color: var(--fg-1);
}

/* Matrix — extends compare-matrix layout with iteration columns and
   archetype-tinted left borders. */
.delta-matrix {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  margin-bottom: 56px;
  overflow-x: auto;
}
.delta-matrix table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
.delta-matrix thead th {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 14px 14px;
  text-align: left;
  font-size: var(--text-xs);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--fg-2);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.delta-matrix thead th.iter-col {
  text-align: center;
  min-width: 64px;
}
.delta-matrix tbody tr.check-row {
  cursor: pointer;
  transition: background var(--motion-fast) var(--ease);
}
.delta-matrix tbody tr.check-row:hover { background: var(--bg-2); }
.delta-matrix tbody tr.check-row td {
  padding: 14px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
.delta-matrix tbody tr.check-row td.head {
  position: relative;
  padding-left: 18px;
}
.delta-matrix tbody tr.check-row td.head::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
}
.delta-matrix tbody tr.check-row[data-archetype="regressed"]       td.head::before { background: var(--fail); }
.delta-matrix tbody tr.check-row[data-archetype="new-fail"]        td.head::before { background: var(--fail); }
.delta-matrix tbody tr.check-row[data-archetype="persistent-fail"] td.head::before { background: var(--warn); }
.delta-matrix tbody tr.check-row[data-archetype="flapping"]        td.head::before { background: var(--warn); }
.delta-matrix tbody tr.check-row[data-archetype="fixed"]           td.head::before { background: var(--pass); }
.delta-matrix tbody tr.check-row[data-archetype="new-pass"]        td.head::before { background: var(--pass); }

.delta-matrix .check-name {
  font-weight: 500;
  color: var(--fg-0);
  font-size: var(--text-base);
}
.delta-matrix .check-id {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
  margin-top: 2px;
}
.delta-matrix .archetype-tag {
  display: inline-block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
  margin-top: 6px;
}
.delta-matrix .archetype-tag[data-archetype="regressed"]       { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-bd); }
.delta-matrix .archetype-tag[data-archetype="new-fail"]        { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-bd); }
.delta-matrix .archetype-tag[data-archetype="persistent-fail"] { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-bd); }
.delta-matrix .archetype-tag[data-archetype="flapping"]        { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-bd); }
.delta-matrix .archetype-tag[data-archetype="fixed"]           { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
.delta-matrix .archetype-tag[data-archetype="new-pass"]        { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
.delta-matrix .archetype-tag[data-archetype="persistent-pass"] { background: var(--skip-bg); color: var(--fg-3); border: 1px solid var(--skip-bd); }

.delta-matrix td.iter-cell {
  text-align: center;
  width: 64px;
}
.delta-matrix td.iter-cell .pip {
  display: inline-flex;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
}
.delta-matrix td.iter-cell .pip svg { width: 12px; height: 12px; stroke-width: 2.6; }
.delta-matrix td.iter-cell.pass    .pip { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
.delta-matrix td.iter-cell.fail    .pip { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-bd); }
.delta-matrix td.iter-cell.skipped .pip { background: var(--skip-bg); color: var(--skip); border: 1px solid var(--skip-bd); }
.delta-matrix td.iter-cell.empty   .pip { background: transparent; color: var(--fg-4); border: 1px dashed var(--line); }

/* Drill-down row — appears beneath the clicked check-row. Holds the
   per-iteration evidence/details/suggestion stack. */
.delta-matrix tbody tr.drill-row { background: var(--bg-2); }
.delta-matrix tbody tr.drill-row td {
  padding: 0;
  border-bottom: 1px solid var(--line);
}
.delta-matrix .drill-inner {
  padding: 18px 24px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.delta-matrix .drill-inner .di-suggest {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: var(--text-sm);
  color: var(--fg-1);
  line-height: 1.55;
}
.delta-matrix .drill-inner .di-suggest .di-label {
  display: block;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 4px;
}
.delta-matrix .drill-inner .di-iters {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.delta-matrix .drill-inner .di-iter {
  display: grid;
  grid-template-columns: 88px auto 1fr;
  gap: 12px;
  align-items: start;
  padding: 8px 0;
  border-top: 1px dashed var(--line);
}
.delta-matrix .drill-inner .di-iter:first-child { border-top: none; }
.delta-matrix .drill-inner .di-iter .di-label-iter {
  font-family: "Geist Mono", ui-monospace, monospace;
  font-size: var(--text-xs);
  color: var(--fg-3);
}
.delta-matrix .drill-inner .di-iter .di-result {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 4px;
  align-self: start;
}
.delta-matrix .drill-inner .di-iter .di-result.pass    { background: var(--pass-bg); color: var(--pass); border: 1px solid var(--pass-bd); }
.delta-matrix .drill-inner .di-iter .di-result.fail    { background: var(--fail-bg); color: var(--fail); border: 1px solid var(--fail-bd); }
.delta-matrix .drill-inner .di-iter .di-result.skipped { background: var(--skip-bg); color: var(--skip); border: 1px solid var(--skip-bd); }
.delta-matrix .drill-inner .di-iter .di-detail {
  font-size: var(--text-sm);
  color: var(--fg-2);
  line-height: 1.55;
}
.delta-matrix .drill-inner .di-iter .di-detail.empty {
  color: var(--fg-4);
  font-style: italic;
}

/* When the matrix is empty (filter excluded everything) */
.delta-matrix .empty-state {
  padding: 48px 24px;
  text-align: center;
  color: var(--fg-3);
  font-size: var(--text-sm);
}

/* ─── viewport badge (used in audit verdict + library cards) ─ */
.viewport-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--text-xs);
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--bg-3);
  border: 1px solid var(--line);
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.lib-card-vp {
  margin-top: 6px;
  align-self: flex-start;
}

/* ─── library (cross-project index) ─────────────────────── */
.lib-header {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 32px 0 24px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 32px;
}
.lib-header h1 {
  font-size: var(--text-xl);
  letter-spacing: -0.02em;
  font-weight: 600;
  margin: 0;
  color: var(--fg-1);
}
.lib-header p {
  margin: 0;
  color: var(--fg-3);
  font-size: var(--text-base);
  max-width: 64ch;
  line-height: 1.55;
}
/* Lite-mode banner — only shown in per-workspace dashboards where the
   embedded library payload doesn't include per-check data. Surfaces a
   one-click jump to ~/.agents/uxaudit/library.html for cross-project
   compare. Subtle, doesn't compete with the page heading. */
.lib-lite-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-size: var(--text-sm);
  color: var(--fg-2);
  margin-top: 4px;
}
.lib-lite-banner .lib-lite-msg { flex: 1; }
.lib-lite-banner .lib-lite-link {
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  white-space: nowrap;
  padding: 4px 10px;
  border: 1px solid var(--accent-bd);
  border-radius: 4px;
  background: var(--accent-bg);
  transition: background var(--motion-fast) var(--ease);
}
.lib-lite-banner .lib-lite-link:hover {
  background: var(--accent);
  color: var(--accent-fg);
}
.lib-controls {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  margin-top: 6px;
}
.lib-search {
  flex: 1 1 240px;
  min-width: 200px;
  max-width: 360px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  color: var(--fg-1);
  font-size: 13px;
  font-family: inherit;
  padding: 9px 12px;
  border-radius: 8px;
  transition: border-color 120ms ease;
}
.lib-search:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.lib-search::placeholder { color: var(--fg-4); }
.lib-filter {
  display: flex;
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg-2);
}
.lib-filter button {
  background: transparent;
  border: 0;
  color: var(--fg-3);
  font: inherit;
  font-size: var(--text-sm);
  padding: 8px 14px;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease;
}
.lib-filter button:hover { color: var(--fg-1); }
.lib-filter button.active {
  background: var(--accent);
  color: var(--accent-fg);
}
.lib-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 18px;
}
.lib-card {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: border-color 140ms ease, transform 140ms ease;
  position: relative;
}
.lib-card:hover {
  border-color: var(--fg-4);
  transform: translateY(-1px);
}
.lib-card.archived { opacity: 0.55; }
.lib-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}
/* Left column has explicit min-width:0 so children can truncate */
.lib-card-left { min-width: 0; flex: 1 1 auto; }
.lib-card-name {
  font-size: var(--text-md);
  font-weight: 600;
  color: var(--fg-1);
  letter-spacing: -0.01em;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lib-card-url {
  font-size: var(--text-xs);
  color: var(--fg-3);
  text-decoration: none;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  display: block;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.lib-card-url:hover { color: var(--accent); }
/* Viewport badge below URL — space separated, tiny */
.lib-card-vp { margin-top: 8px; }
.lib-card-rate {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.02em;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.lib-card-rate.high { color: var(--pass); }
.lib-card-rate.mid  { color: var(--warn, #d97706); }
.lib-card-rate.low  { color: var(--fail); }
.lib-card-rate .sym { font-size: var(--text-base); opacity: 0.7; margin-left: 1px; }
.lib-spark {
  display: block;
  width: 100%;
  height: 36px;
}
.lib-spark .spark-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.lib-spark .spark-fill {
  fill: var(--accent);
  fill-opacity: 0.08;
  stroke: none;
}
.lib-spark .spark-dot {
  fill: var(--accent);
}
.lib-spark .spark-dot.last {
  fill: var(--accent);
  stroke: var(--bg-2);
  stroke-width: 2;
  r: 3.5;
}
/* Minimal single-line meta — last-run freshness only */
.lib-card-meta-line {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: var(--text-xs);
}
.lib-card-meta-line .k {
  color: var(--fg-4);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 500;
}
.lib-card-meta-line .v {
  color: var(--fg-2);
  font-variant-numeric: tabular-nums;
}
.lib-card-actions {
  display: flex;
  gap: 8px;
  /* margin-top: auto pins actions to the bottom of the flex column so
     buttons on adjacent cards line up horizontally even when cards
     above the actions (URL presence, sparkline length, meta lines)
     have different content heights. */
  margin-top: auto;
}
.lib-card-actions a, .lib-card-actions button {
  /* min-width:0 lets flex items shrink below content width when needed;
     white-space:nowrap keeps short JP labels on one line at any width. */
  min-width: 0;
  text-align: center;
  padding: 9px 14px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg-2);
  font: inherit;
  font-size: var(--text-sm);
  text-decoration: none;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
}
/* Primary gets the lion's share so the "open dashboard" label never wraps;
   secondary archive/unarchive action stays compact. */
.lib-card-actions a.primary {
  flex: 2 1 0;
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.lib-card-actions button {
  flex: 1 1 0;
}
.lib-card-actions a.primary:hover { filter: brightness(0.95); }
.lib-card-actions button:hover {
  border-color: var(--fg-3);
  color: var(--fg-1);
}
.lib-card-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--bg-3);
  color: var(--fg-3);
  border: 1px solid var(--line);
}
.lib-empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--fg-3);
  font-size: var(--text-base);
}
.lib-empty .big { font-size: 18px; color: var(--fg-2); margin-bottom: 6px; }
.lib-empty code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: var(--text-sm);
  color: var(--fg-1);
  background: var(--bg-3);
  padding: 1px 6px;
  border-radius: 4px;
}
.lib-foot {
  margin-top: 40px;
  padding: 20px 0 0;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-size: var(--text-xs);
  color: var(--fg-4);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.lib-foot .hint {
  font-family: inherit;
  color: var(--fg-3);
  flex: 1 1 320px;
  max-width: 64ch;
  line-height: 1.55;
}
.lib-foot .hint code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--bg-3);
  padding: 1px 5px;
  border-radius: 3px;
  font-size: var(--text-xs);
  color: var(--fg-1);
}

.hidden { display: none !important; }

@media (max-width: 980px) {
  .shell { padding: 0 20px 64px; }
  .header { grid-template-columns: 1fr; gap: 24px; align-items: start; }
  .headline-stat { text-align: left; }
  .verdict { grid-template-columns: 1fr; gap: 24px; }
  .verdict .v-action { align-items: flex-start; border-left: none; padding-left: 0; padding-top: var(--space-4); border-top: 1px solid var(--line); width: 100%; }
  .verdict .v-action .va-num { text-align: left; }
  .band-row { grid-template-columns: 1fr; }
  .asset-sheet .as-dialog { inset: 12px; }
  .asset-sheet .as-body { padding: 12px; }
  .lightbox .lb-dialog { inset: 12px; }
  .lightbox .lb-stage { padding: 12px; }
  .lightbox .lb-stage img { max-height: calc(100vh - 180px); }
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <span class="accent-dot"></span>
      uxaudit
    </div>

function t(key, vars) {
  const dict = I18N[currentLang] || I18N.en;
  let s = dict[key] ?? I18N.en[key] ?? key;
  if (vars) {
    for (const [k, v] of Object.entries(vars)) s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), v);
  }
  return s;
}

/* ─── theme ─────────────────────────────────────────────── */
const SUN_PATH = 'M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41';
const SUN_CIRCLE = '<circle cx="12" cy="12" r="4"/>';
const MOON_PATH = 'M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z';

function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  const icon = document.getElementById('theme-icon');
  if (icon) {
    icon.innerHTML = currentTheme === 'dark'
      ? `<svg viewBox="0 0 24 24"><path d="${SUN_PATH}"/>${SUN_CIRCLE}</svg>`
      : `<svg viewBox="0 0 24 24"><path d="${MOON_PATH}"/></svg>`;
  }
}

function applyLanguage() {
  document.documentElement.setAttribute('lang', currentLang);
  const langBtn = document.getElementById('lang-toggle');
  if (langBtn) langBtn.textContent = currentLang === 'en' ? 'EN' : 'JA';
  // refresh nav button labels
  document.querySelectorAll('.topbar nav button[data-i18n]').forEach(b => {
    const lab = b.querySelector('.label');
    if (lab) lab.textContent = t(b.dataset.i18n);
  });
  // Singleton bars live outside #content and survive re-renders; refresh
  // their static text labels so a language toggle takes effect even
  // before the next render() call.
  if (typeof updateFixBar === 'function')     updateFixBar();
  if (typeof updateCompareBar === 'function') updateCompareBar();
}

/* ─── state ─────────────────────────────────────────────── */
let currentMode = DATA._mode || 'single';
let currentAppIdx = 0;
let currentIterIdx = (DATA.apps?.[0]?.iterations?.length ?? 1) - 1;
// The currently-rendered iteration's shared target screenshot, used as a
// fallback evidence source for L3-vision checks. L3 Judges all look at the
// same `{ITER_DIR}/target/screenshot.png` (captured once per iteration by
// capture.mjs) and rarely drop their own crops, so without this fallback an
// L3 fail card would have no image attached even though the dashboard has the
// exact bytes the Judge evaluated. Set inside renderSingle / renderTimeline.
let currentTargetScreenshot = null;
let currentLang = (() => {
  // Resolution order:
  //   1. URL ?lang=ja|en — explicit override (e.g. someone shares a link)
  //   2. localStorage 'uxchecks.lang' — user previously toggled the button
  //   3. The audit's pinned language from benchmark.json metadata
  //      (set by /uxaudit --lang at invocation; lives at iterations[*].language)
  //   4. 'en' fallback
  // This way an audit run with --lang ja opens straight into 日本語 mode
  // without requiring the user to click the toggle, while manual toggles
  // and shared links still take precedence.
  try {
    const url = new URL(location.href).searchParams.get('lang');
    if (url) return url;
    const stored = localStorage.getItem('uxchecks.lang');
    if (stored) return stored;
  } catch {}
  for (const a of (DATA.apps || [])) {
    for (const it of (a.iterations || [])) {
      if (it.language) return it.language;
    }
  }
  return 'en';
})();
let currentTheme = (() => {
  try { return localStorage.getItem('uxchecks.theme') || 'dark'; } catch { return 'dark'; }
})();
const expanded = new Set(); // reserved for collapse/expand state across renders
let lightboxState = { items: [], index: 0, owner: '' };

// Timeline mode (the History tab) has two sub-views:
// - 'delta' (default): action-first delta view — what changed since iter 1
// - 'iter' : drill into a single iteration's full audit body
// Switching between them is local to Timeline; entering History always
// resets to 'delta' so users see the actionable summary first.
let timelineSubMode = 'delta';
let timelineFilter  = 'changes';     // 'changes' | 'fixed' | 'regressed' | 'persistent-fail' | 'flapping' | 'new' | 'all'
const timelineDrillSet = new Set();   // check_ids whose drill-down rows are open

/* ─── Fix queue ─────────────────────────────────────────────
   User-selectable pool of fixes. Each entry is keyed by a stable
   string id (`proposal:N` or `fail:<check_id>`) and carries enough
   metadata to regenerate a clean markdown fix prompt for the next
   coding-agent turn. Cleared on every render() because selections
   don't meaningfully carry across app/iteration switches. */
const fixQueue = new Map();

function addToFixQueue(key, entry) {
  fixQueue.set(key, entry);
  updateFixBar();
}
function removeFromFixQueue(key) {
  fixQueue.delete(key);
  updateFixBar();
}
function clearFixQueue() {
  fixQueue.clear();
  // Also uncheck any live DOM checkboxes since they survive outside
  // fixQueue state (e.g. when called from the "Clear" button).
  document.querySelectorAll('.fix-check').forEach(cb => { cb.checked = false; });
  updateFixBar();
}

function updateFixBar() {
  const bar = document.getElementById('fix-bar');
  if (!bar) return;
  const n = fixQueue.size;
  bar.classList.toggle('open', n > 0);
  const countEl = bar.querySelector('.fix-bar-count');
  if (countEl) countEl.textContent = String(n);
  // Refresh ALL text labels on every call — this is what picks up new
  // strings when the user toggles the language (render() → updateFixBar).
  // The bar itself is a singleton so its DOM is never re-created.
  const labelEl = bar.querySelector('.fix-bar-label');
  if (labelEl) labelEl.textContent = n === 1 ? t('fixbar.selectedOne') : t('fixbar.selectedMany');
  const copyBtn = bar.querySelector('.fix-bar-copy');
  if (copyBtn) copyBtn.textContent = t('fixbar.copy');
  const clearBtn = bar.querySelector('.fix-bar-clear');
  if (clearBtn) clearBtn.textContent = t('fixbar.clear');
}

function queueCheckbox(key, entry) {
  // A compact toggle. Checkbox state is the only source of truth for the
  // user; fixQueue is a mirror that the bottom bar reads.
  const label = el('label', {
    class: 'fix-check-wrap',
    title: t('fixbar.checkboxTitle'),
  });
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'fix-check';
  cb.setAttribute('aria-label', t('fixbar.checkboxAria', { label: entry.label }));
  // Restore state on re-render if the same key is still in the queue
  if (fixQueue.has(key)) cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) addToFixQueue(key, entry);
    else removeFromFixQueue(key);
  });
  // Prevent the wrapping label click from toggling parent card open/close
  label.addEventListener('click', (e) => e.stopPropagation());
  label.appendChild(cb);
  return label;
}

function buildFixMarkdown(entries) {
  const lines = [];
  lines.push('# Apply these uxaudit fixes');
  lines.push('');
  lines.push(`> Generated from the uxaudit dashboard. ${entries.length} item${entries.length === 1 ? '' : 's'} selected.`);
  lines.push('>');
  lines.push('> Your task: apply the fixes below to the codebase. Preserve existing functionality, keep the changes focused, and explain what you changed. After you are done, the user may re-run uxaudit to verify.');
  lines.push('');
  entries.forEach((e, i) => {
    lines.push(`## Fix ${i + 1}: ${e.label}`);
    lines.push('');
    if (e.kind === 'proposal') {
      const p = e.data;
      if (p.why_first) {
        lines.push(`**Why this matters**: ${p.why_first}`);
        lines.push('');
      }
      const steps = Array.isArray(p.concrete_steps) ? p.concrete_steps : [];
      if (steps.length > 0) {
        lines.push('**Concrete steps**:');
        steps.forEach(s => lines.push(`- ${s}`));
        lines.push('');
      }
      const files = Array.isArray(p.estimated_files) ? p.estimated_files : [];
      if (files.length > 0) {
        lines.push('**Estimated files to touch**:');
        files.forEach(f => lines.push(`- \`${f}\``));
        lines.push('');
      }
      const addrs = Array.isArray(p.addresses_fails) ? p.addresses_fails : [];
      if (addrs.length > 0) {
        lines.push(`**Addresses checks**: ${addrs.map(a => `\`${a}\``).join(', ')}`);
        lines.push('');
      }
    } else if (e.kind === 'fail') {
      const c = e.data;
      if (c.check_id)  { lines.push(`**Check**: \`${c.check_id}\``); }
      if (c.severity)  { lines.push(`**Severity**: ${c.severity}`); }
      if (c.category)  { lines.push(`**Category**: ${c.category}`); }
      lines.push('');
      const det = c.evidence && c.evidence.details;
      if (det) {
        lines.push('**What the judge saw**:');
        lines.push(`> ${det.replace(/\n/g, '\n> ')}`);
        lines.push('');
      }
      // L4 journey fails carry a structured 4-axis breakdown. Include it in
      // the markdown export so the LLM recipient can target the right axis
      // (fixing operating_cost needs a different kind of change than fixing
      // value_delivery). Skip silently on non-L4 checks where the field is
      // absent.
      const je = c.journey_evaluation;
      if (je && typeof je === 'object') {
        lines.push('**Journey evaluation (4 axes)**:');
        const AXES = ['value_delivery', 'task_completion', 'operating_cost', 'feedback_quality'];
        AXES.forEach(k => {
          const axis = je[k];
          if (!axis) return;
          const verdict = String(axis.verdict || '?').toUpperCase();
          lines.push(`- **${k}** — ${verdict}`);
          if (axis.evidence) lines.push(`  ${axis.evidence}`);
          if (k === 'operating_cost') {
            const bits = [];
            if (typeof axis.actual_steps === 'number') bits.push(`${axis.actual_steps} steps`);
            if (typeof axis.intentional_steps === 'number') bits.push(`${axis.intentional_steps} intentional`);
            if (typeof axis.unintentional_excess === 'number') bits.push(`${axis.unintentional_excess} unjustified excess`);
            if (bits.length > 0) lines.push(`  (${bits.join(' · ')})`);
            const attrib = Array.isArray(axis.excise_attribution) ? axis.excise_attribution : [];
            if (attrib.length > 0) {
              lines.push('  Step-by-step excise breakdown:');
              attrib.forEach(a => {
                if (!a) return;
                lines.push(`    - Step ${a.step ?? '?'} (${a.kind ?? '?'}): ${a.rationale ?? ''}`);
              });
            }
          }
        });
        lines.push('');
      }
      if (c.suggestion) {
        lines.push('**Suggested fix**:');
        lines.push(c.suggestion);
        lines.push('');
      }
    }
    lines.push('---');
    lines.push('');
  });
  return lines.join('\n').trim() + '\n';
}

async function copyFixPrompt() {
  const entries = [...fixQueue.values()];
  if (entries.length === 0) return;
  const md = buildFixMarkdown(entries);
  try {
    await navigator.clipboard.writeText(md);
    showToast(t('fixbar.copied', { n: entries.length }));
  } catch (err) {
    // Fallback: show a modal with the text so the user can manually copy
    console.warn('clipboard write failed', err);
    showToast(t('fixbar.copyFailed'));
    try {
      const ta = document.createElement('textarea');
      ta.value = md;
      ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast(t('fixbar.copied', { n: entries.length }));
    } catch {}
  }
}

function showToast(text, durationMs) {
  const node = document.createElement('div');
  node.className = 'toast';
  node.textContent = text;
  document.body.appendChild(node);
  // force reflow then add .show to trigger transition
  void node.offsetWidth;
  node.classList.add('show');
  const dur = (typeof durationMs === 'number' && durationMs > 0) ? durationMs : 2400;
  setTimeout(() => {
    node.classList.remove('show');
    setTimeout(() => node.remove(), 320);
  }, dur);
}

/* ─── Compare queue ─────────────────────────────────────────
   Library cards get their own selection queue for cross-workspace
   compare. Picking 2+ workspaces in Library mode reveals a sticky
   bar that switches to Compare mode with those workspaces' slim
   check data synthesized into an app[] array.

   Uses the same interaction pattern as the fix queue (checkbox +
   sticky bar) so the mental model stays consistent. */
const compareQueue = new Map(); // path → workspace record

function addToCompareQueue(path, workspace) {
  compareQueue.set(path, workspace);
  updateCompareBar();
}
function removeFromCompareQueue(path) {
  compareQueue.delete(path);
  updateCompareBar();
}
function clearCompareQueue() {
  compareQueue.clear();
  document.querySelectorAll('.compare-check').forEach(cb => { cb.checked = false; });
  updateCompareBar();
}
function updateCompareBar() {
  const bar = document.getElementById('compare-bar');
  if (!bar) return;
  const n = compareQueue.size;
  // Needs 2+ to enable comparison; 1 is shown but the button is disabled.
  bar.classList.toggle('open', n > 0);
  const countEl = bar.querySelector('.compare-bar-count');
  if (countEl) countEl.textContent = String(n);
  // Refresh ALL text labels on every call — same rationale as updateFixBar.
  const labelEl = bar.querySelector('.compare-bar-label');
  if (labelEl) labelEl.textContent = n === 1 ? t('comparebar.selectedOne') : t('comparebar.selectedMany');
  const goBtn = bar.querySelector('.compare-bar-go');
  if (goBtn) {
    goBtn.textContent = t('comparebar.go');
    goBtn.disabled = n < 2;
    goBtn.title = n < 2 ? t('comparebar.needTwo') : '';
  }
  const clearBtn = bar.querySelector('.compare-bar-clear');
  if (clearBtn) clearBtn.textContent = t('comparebar.clear');
}

function compareCheckbox(workspace) {
  // Lite library payload (per-workspace dashboards) intentionally
  // strips latest_checks to keep the embedded blob small. Without
  // per-check data the compare matrix has nothing to render, so we
  // hide the checkbox here entirely. The Library header in lite mode
  // shows an "Open full Library →" link instead — cross-project
  // compare lives in ~/.agents/uxaudit/library.html.
  if (DATA.library && DATA.library.with_check_data === false) return null;
  const key = workspace.path || workspace.target || '';
  if (!key) return null;
  const label = el('label', {
    class: 'fix-check-wrap compare-check-wrap',
    title: t('comparebar.checkboxTitle'),
  });
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'fix-check compare-check';
  cb.setAttribute('aria-label', t('comparebar.checkboxAria', { label: workspace.target || 'workspace' }));
  if (compareQueue.has(key)) cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) addToCompareQueue(key, workspace);
    else removeFromCompareQueue(key);
  });
  label.addEventListener('click', (e) => e.stopPropagation());
  label.appendChild(cb);
  return label;
}

function ensureCompareBar() {
  if (document.getElementById('compare-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'compare-bar';
  bar.className = 'fix-bar compare-bar';
  bar.setAttribute('role', 'region');
  bar.setAttribute('aria-label', 'Compare queue');
  bar.innerHTML = `
    <div class="fix-bar-inner">
      <span class="fix-bar-count compare-bar-count" aria-live="polite">0</span>
      <span class="fix-bar-label compare-bar-label">${t('comparebar.selectedMany')}</span>
      <button type="button" class="fix-bar-copy compare-bar-go"></button>
      <button type="button" class="fix-bar-clear compare-bar-clear"></button>
    </div>
  `;
  const goBtn = bar.querySelector('.compare-bar-go');
  goBtn.textContent = t('comparebar.go');
  goBtn.addEventListener('click', launchCompareFromQueue);
  const clearBtn = bar.querySelector('.compare-bar-clear');
  clearBtn.textContent = t('comparebar.clear');
  clearBtn.addEventListener('click', clearCompareQueue);
  document.body.appendChild(bar);
}

/* Turn a selected workspace record (from the library registry) into
   the same shape renderCompare() / buildMatrix() expect — an "app"
   with one synthetic "iteration" holding the slim check list.
   Nests `details` under evidence.details so the matrix can read it
   without special-casing. */
function workspaceToApp(ws) {
  const slim = Array.isArray(ws.latest_checks) ? ws.latest_checks : [];
  const checks = slim.map(c => ({
    ...c,
    evidence: { details: c.details || '', matches: [] },
  }));
  const summary = {
    total:   ws.latest_total   || checks.length,
    passed:  ws.latest_passed  != null ? ws.latest_passed  : checks.filter(c => c.result === 'pass').length,
    failed:  ws.latest_failed  != null ? ws.latest_failed  : checks.filter(c => c.result === 'fail').length,
    skipped: ws.latest_skipped != null ? ws.latest_skipped : checks.filter(c => c.result === 'skipped').length,
    pass_rate: ws.latest_pass_rate,
  };
  return {
    name: ws.target || '(unnamed)',
    url:  ws.url || '',
    iterations: [{
      iteration: 1,
      label: ws.latest_label || 'latest',
      generated_at: ws.latest_run_at,
      summary,
      checks,
      screenshot_data_uri: '',
      viewport: ws.latest_viewport ? { preset: ws.latest_viewport } : null,
      target_kind: ws.latest_target_kind || null,
    }],
  };
}

/* Pre-seed the compare queue with the currently-viewed app (from
   single / timeline mode) so entering the Library tab is always
   "pick one more to compare against" rather than "pick two from
   scratch". Looks up the library workspace by _workspace_path,
   then falls back to (target + url), then (target alone). Bails
   silently if no match — users browsing an ad-hoc dir still see a
   clean library. */
function preseedCompareQueueFromCurrentApp() {
  // Lite library payload has no per-check data → cross-project compare
  // is unavailable here. Bail out so we don't seed a phantom selection
  // the user can never act on. The full Library page handles this.
  if (DATA.library && DATA.library.with_check_data === false) return;
  const apps = DATA.apps || [];
  const app = apps[currentAppIdx] || apps[0];
  if (!app) return;
  const lib = (DATA.library && Array.isArray(DATA.library.workspaces))
    ? DATA.library.workspaces
    : [];
  if (lib.length === 0) return;

  const wantPath = app._workspace_path || '';
  const wantName = app.name || '';
  const wantUrl  = app.url || '';

  const byPath = wantPath
    ? lib.find(w => w.path === wantPath && !w.archived)
    : null;
  const byNameUrl = !byPath && wantName && wantUrl
    ? lib.find(w => w.target === wantName && w.url === wantUrl && !w.archived)
    : null;
  const byName = (!byPath && !byNameUrl && wantName)
    ? lib.find(w => w.target === wantName && !w.archived)
    : null;

  const match = byPath || byNameUrl || byName;
  if (!match) return;
  // Only seed workspaces that actually have check data — otherwise
  // "compare" would silently include an empty row. Silent is fine
  // because the user will still see their current app as a library
  // card and can toggle the checkbox themselves if they insist.
  if (!Array.isArray(match.latest_checks) || match.latest_checks.length === 0) return;

  const key = match.path || match.target || '';
  if (!key) return;
  compareQueue.set(key, match);
}

function launchCompareFromQueue() {
  const selected = [...compareQueue.values()];
  if (selected.length < 2) return;
  // Any workspace with empty latest_checks (e.g. an ancient registry
  // entry with no lazy-load available) gets warned about but is still
  // passed through — the matrix will show zero rows for it.
  const missing = selected.filter(w => !Array.isArray(w.latest_checks) || w.latest_checks.length === 0);
  if (missing.length > 0) {
    showToast(t('comparebar.missingData', { names: missing.map(w => w.target).join(', ') }));
  }
  // Replace the current apps array with synthetic apps built from the
  // library selection, then switch to compare mode.
  const synthetic = selected.map(workspaceToApp);
  DATA._comparePool = synthetic;
  DATA._compareFromLibrary = true;
  currentMode = 'compare';
  // Make sure the Compare tab is shown even if the capability flag was off
  const caps = DATA._capabilities || {};
  caps.compare = true;
  DATA._capabilities = caps;
  render();
}

function init() {
  applyTheme();
  applyLanguage();
  ensureLightbox();
  const caps = DATA._capabilities || { single: true, timeline: false, compare: false, library: false };
  document.getElementById('mode-single').classList.toggle('disabled', !caps.single);
  document.getElementById('mode-timeline').classList.toggle('disabled', !caps.timeline);
  document.getElementById('mode-compare').classList.toggle('disabled', !caps.compare);
  document.getElementById('mode-library').classList.toggle('disabled', !caps.library);
  document.querySelectorAll('.topbar nav button').forEach(b => {
    b.addEventListener('click', () => {
      if (b.classList.contains('disabled')) return;
      currentMode = b.dataset.mode;
      expanded.clear();
      // Entering History always lands on the new delta view (not whatever
      // sub-mode the user left it on previously). Reset all delta-view
      // local state so the iteration drill-set / filter chips don't
      // carry over from a previous visit.
      if (currentMode === 'timeline') {
        timelineSubMode = 'delta';
        timelineFilter = 'changes';
        timelineDrillSet.clear();
      }
      render();
    });
  });
  document.getElementById('theme-toggle').addEventListener('click', () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('uxchecks.theme', currentTheme); } catch {}
    applyTheme();
  });
  document.getElementById('lang-toggle').addEventListener('click', () => {
    currentLang = currentLang === 'en' ? 'ja' : 'en';
    try { localStorage.setItem('uxchecks.lang', currentLang); } catch {}
    applyLanguage();
    render();
  });
  render();
}

function openAssetSheet(check) {
  const files = effectiveEmbeddedFiles(check).filter(f =>
    /\.(png|jpe?g|webp|gif|mp4|webm|mov)$/i.test(f.name || '')
  );
  if (files.length === 0) return;

function closeAssetSheet() {
  const root = document.getElementById('asset-sheet');
  if (!root) return;

  root.setAttribute('aria-hidden', 'true');
}

function ensureLightbox() {
  if (document.getElementById('evidence-lightbox')) return;
  const root = el('div', { class: 'lightbox', id: 'evidence-lightbox', 'aria-hidden': 'true' });
  root.innerHTML = `
    <div class="lb-backdrop"></div>
    <div class="lb-dialog" role="dialog" aria-modal="true" aria-label="Evidence image">
      <div class="lb-head">
        <span class="icon">${svgIcon('layers')}</span>
        <div class="lb-title" id="lb-title"></div>
        <div class="lb-owner" id="lb-owner"></div>
        <div class="lb-spacer"></div>
        <button type="button" class="lb-close" id="lb-close" aria-label="Close">${svgIcon('x')}</button>
      </div>
      <div class="lb-stage" id="lb-stage"></div>
      <div class="lb-foot">
        <button type="button" class="lb-nav" id="lb-prev" aria-label="Previous">${svgIcon('arrowR').replace('M5 12h14M12 5l7 7-7 7', 'M19 12H5m7 7-7-7 7-7')}</button>
        <button type="button" class="lb-nav" id="lb-next" aria-label="Next">${svgIcon('arrowR')}</button>
        <div class="lb-meta" id="lb-meta"></div>
      </div>
    </div>
  `;
  document.body.appendChild(root);
  root.querySelector('.lb-backdrop').addEventListener('click', closeLightbox);
  root.querySelector('#lb-close').addEventListener('click', closeLightbox);
  root.querySelector('#lb-prev').addEventListener('click', () => moveLightbox(-1));
  root.querySelector('#lb-next').addEventListener('click', () => moveLightbox(1));
  document.addEventListener('keydown', (e) => {
    if (!root.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') moveLightbox(-1);
    else if (e.key === 'ArrowRight') moveLightbox(1);
  });
}

function openLightbox(items, startIndex, owner) {
  if (!items || items.length === 0) return;
  lightboxState = { items, index: startIndex || 0, owner: owner || '' };
  const root = document.getElementById('evidence-lightbox');
  if (!root) return;
  root.classList.add('open');
  root.setAttribute('aria-hidden', 'false');
  syncLightbox();
}

function closeLightbox() {
  const root = document.getElementById('evidence-lightbox');
  if (!root) return;
  root.classList.remove('open');
  root.setAttribute('aria-hidden', 'true');
}

function moveLightbox(delta) {
  const next = lightboxState.index + delta;
  if (next < 0 || next >= lightboxState.items.length) return;
  lightboxState.index = next;
  syncLightbox();
}

function syncLightbox() {
  const root = document.getElementById('evidence-lightbox');
  if (!root || lightboxState.items.length === 0) return;
  const item = lightboxState.items[lightboxState.index];
  const stage = root.querySelector('#lb-stage');
  stage.innerHTML = '';
  if (/\.(mp4|webm|mov)$/i.test(item.name || '')) {
    const video = document.createElement('video');
    video.src = item.data_uri;
    video.controls = true;
    video.preload = 'metadata';
    video.playsInline = true;
    video.className = 'lb-video';
    stage.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = item.data_uri;
    img.alt = item.name || '';
    stage.appendChild(img);
  }
  root.querySelector('#lb-title').textContent = item.name || '';
  root.querySelector('#lb-owner').textContent = lightboxState.owner || '';
  root.querySelector('#lb-meta').textContent = t('lb.imageCount', {
    i: lightboxState.index + 1,
    n: lightboxState.items.length,
  });
  root.querySelector('#lb-prev').toggleAttribute('disabled', lightboxState.index === 0);
  root.querySelector('#lb-next').toggleAttribute('disabled', lightboxState.index >= lightboxState.items.length - 1);
  root.querySelector('#lb-close').setAttribute('aria-label', t('lb.close'));
  root.querySelector('#lb-prev').setAttribute('aria-label', t('lb.prev'));
  root.querySelector('#lb-next').setAttribute('aria-label', t('lb.next'));
}

function render() {
  // Selections don't carry across app / mode / iteration switches
  clearFixQueue();
  ensureFixBar();
  // Compare queue survives library ↔ compare transitions so the user
  // can tweak their selection after seeing the matrix. It only gets
  // cleared when fully leaving those two modes.
  if (currentMode !== 'library' && currentMode !== 'compare') {
    clearCompareQueue();
  } else if (currentMode === 'library' && compareQueue.size === 0) {
    // Entering library fresh — pre-seed with the currently-viewed app
    // (if any) so the user only needs to pick ONE more workspace to
    // start a comparison. Match by _workspace_path first (stable),
    // then fall back to (target + url). No-op if the current app
    // isn't in the library (e.g. an ad-hoc iteration-path audit).
    preseedCompareQueueFromCurrentApp();
  }
  ensureCompareBar();
  // Reflect persisted selection in the bar on mode re-entry
  updateCompareBar();
  // Refresh disabled state from live capabilities so library-driven
  // compare can enable the tab on demand.
  const caps = DATA._capabilities || {};
  const capKey = { 'mode-single': 'single', 'mode-timeline': 'timeline', 'mode-compare': 'compare', 'mode-library': 'library' };
  document.querySelectorAll('.topbar nav button').forEach(b => {
    const isActive = b.dataset.mode === currentMode;
    b.classList.toggle('active', isActive);
    b.setAttribute('aria-selected', isActive ? 'true' : 'false');
    const key = capKey[b.id];
    if (key && caps[key] === false) {
      b.classList.add('disabled');
      b.setAttribute('aria-disabled', 'true');
    } else {
      b.classList.remove('disabled');
      b.removeAttribute('aria-disabled');
    }
  });
  const apps = DATA.apps || [];

  // app switcher (visible only when 2+ apps AND mode is single/timeline)
  const sw = document.getElementById('topbar-apps');
  sw.innerHTML = '';
  if (apps.length >= 2 && (currentMode === 'single' || currentMode === 'timeline')) {
    sw.style.display = 'flex';
    apps.forEach((a, i) => {
      const b = document.createElement('button');
      b.textContent = a.name;
      b.className = (i === currentAppIdx ? 'active' : '');
      b.addEventListener('click', () => {
        currentAppIdx = i;
        currentIterIdx = (apps[i].iterations.length || 1) - 1;
        render();
      });
      sw.appendChild(b);
    });
  } else {
    sw.style.display = 'none';
  }

  // topbar meta
  const meta = document.getElementById('topbar-meta');
  meta.innerHTML = '';
  if (currentMode === 'library') {
    const lib = DATA.library || { workspaces: [] };
    meta.appendChild(document.createTextNode(t('meta.workspaces', { n: lib.workspaces.length })));
  } else if (currentMode === 'compare') {
    meta.appendChild(document.createTextNode(t('meta.apps', { n: apps.length })));
  } else {
    const app = apps[currentAppIdx] || apps[0];
    if (app) {
      const it = app.iterations[currentIterIdx] || app.iterations[app.iterations.length - 1];
      meta.appendChild(document.createTextNode(it?.label || t('meta.iter', { n: it?.iteration || 1 })));
    }
  }
  const root = document.getElementById('content');
  root.innerHTML = '';
  if (currentMode === 'library') return renderLibrary(root);
  if (currentMode === 'compare') return renderCompare(root);
  if (currentMode === 'timeline') return renderTimeline(root);
  return renderSingle(root);
}

/* ─── LIBRARY mode (cross-project index) ────────────────── */
let libFilter = 'active';   // 'all' | 'active' | 'archived'
let libQuery = '';

function renderLibrary(root) {
  const lib = DATA.library || { workspaces: [], registry_path: '' };
  const all = Array.isArray(lib.workspaces) ? lib.workspaces.slice() : [];
  // Newest first
  all.sort((a, b) => {
    const ta = Date.parse(a.last_updated_at || a.latest_run_at || '') || 0;
    const tb = Date.parse(b.last_updated_at || b.latest_run_at || '') || 0;
    return tb - ta;
  });

  // Header
  const header = el('section', { class: 'lib-header' });
  header.appendChild(el('h1', null, [t('lib.title')]));
  header.appendChild(el('p', null, [t('lib.subtitle')]));

  // Lite mode banner — when this dashboard is per-workspace (not the
  // standalone library.html), the embedded library payload omits the
  // per-check data to keep the dashboard small. Cross-project compare
  // lives in ~/.agents/uxaudit/library.html — surface a one-click jump.
  if (lib.with_check_data === false && lib.library_html_path) {
    const liteBanner = el('div', { class: 'lib-lite-banner' });
    const msg = el('span', { class: 'lib-lite-msg' }, [t('lib.lite.msg')]);
    const link = el('a', {
      class: 'lib-lite-link',
      href: 'file://' + lib.library_html_path,
      target: '_blank',
      rel: 'noopener',
    }, [t('lib.lite.openFull')]);
    liteBanner.appendChild(msg);
    liteBanner.appendChild(link);
    header.appendChild(liteBanner);
  }

  const controls = el('div', { class: 'lib-controls' });
  const search = el('input', {
    class: 'lib-search',
    type: 'search',
    placeholder: t('lib.search'),
    value: libQuery,
  });
  search.addEventListener('input', () => {
    libQuery = search.value;
    renderLibraryGrid(grid, all);
  });
  controls.appendChild(search);

  const filter = el('div', { class: 'lib-filter', role: 'tablist' });
  ['active', 'all', 'archived'].forEach(key => {
    const isActive = libFilter === key;
    const btn = el('button', {
      type: 'button',
      role: 'tab',
      'aria-selected': isActive ? 'true' : 'false',
    }, [t('lib.filter.' + key)]);
    if (isActive) btn.classList.add('active');
    btn.addEventListener('click', () => {
      libFilter = key;
      // re-render entire library to refresh filter button highlights
      root.innerHTML = '';
      renderLibrary(root);
    });
    filter.appendChild(btn);
  });
  controls.appendChild(filter);
  header.appendChild(controls);
  root.appendChild(header);

  // Empty registry case
  if (all.length === 0) {
    const empty = el('div', { class: 'lib-empty' });
    empty.appendChild(el('div', { class: 'big' }, [t('lib.empty')]));
    empty.appendChild(el('div', null, [t('lib.emptyHint')]));
    root.appendChild(empty);
    return;
  }

  const grid = el('section', { class: 'lib-grid' });
  root.appendChild(grid);
  renderLibraryGrid(grid, all);

  const foot = el('div', { class: 'lib-foot' });
  const hint = el('div', { class: 'hint', html: t('lib.howToHide') });
  foot.appendChild(hint);
  if (lib.registry_path) {
    foot.appendChild(el('div', null, [t('lib.registryAt', { path: lib.registry_path })]));
  }
  root.appendChild(foot);
}

function renderLibraryGrid(grid, all) {
  grid.innerHTML = '';
  const q = libQuery.trim().toLowerCase();
  const filtered = all.filter(w => {
    if (libFilter === 'active' && w.archived) return false;
    if (libFilter === 'archived' && !w.archived) return false;
    if (q) {
      const hay = ((w.target || '') + ' ' + (w.url || '') + ' ' + (w.path || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (filtered.length === 0) {
    grid.appendChild(el('div', { class: 'lib-empty' }, [t('lib.noResults')]));
    return;
  }
  filtered.forEach(w => grid.appendChild(libCard(w)));
}

function libCard(w) {
  const card = el('article', { class: 'lib-card' });
  if (w.archived) card.classList.add('archived');

  if (w.archived) card.appendChild(el('div', { class: 'lib-card-badge' }, [t('lib.archived')]));

  // Compare-queue checkbox — only meaningful for live workspaces that
  // actually have check data. Skip for archived so the UI doesn't promise
  // something it can't deliver. (Missing entries were pruned upstream in
  // _attach_library, so they never reach this code path.)
  if (!w.archived) {
    const cb = compareCheckbox(w);
    if (cb) card.appendChild(cb);
  }

  const head = el('div', { class: 'lib-card-head' });
  const left = el('div', { class: 'lib-card-left' });
  left.appendChild(el('div', { class: 'lib-card-name' }, [w.target || '(unnamed)']));
  if (w.url) {
    // Truncate very long URLs so they don't dominate the card; keep the
    // actual link intact via title= for hover and the href itself.
    const a = el('a', {
      class: 'lib-card-url',
      href: w.url,
      target: '_blank',
      rel: 'noopener',
      title: w.url,
    }, [shortenUrl(w.url)]);
    left.appendChild(a);
  }
  // Compact viewport badge — kept, near-zero visual cost
  if (w.latest_viewport || w.latest_target_kind) {
    const vpb = viewportBadge(
      w.latest_viewport ? { preset: w.latest_viewport } : null,
      w.latest_target_kind
    );
    if (vpb) {
      vpb.classList.add('lib-card-vp');
      left.appendChild(vpb);
    }
  }
  head.appendChild(left);

  const ratePct = w.latest_pass_rate != null ? Math.round(w.latest_pass_rate * 100) : null;
  const rateEl = el('div', { class: 'lib-card-rate ' + rateClass(ratePct ?? 0) });
  if (ratePct == null) rateEl.textContent = '—';
  else { rateEl.innerHTML = ratePct + '<span class="sym">%</span>'; }
  head.appendChild(rateEl);
  card.appendChild(head);

  // Sparkline — trend at a glance
  const spark = libSparkline(w.sparkline || []);
  if (spark) card.appendChild(spark);

  // Minimal meta — single line, only the freshness signal
  const lastRunStr = fmtDate(w.latest_run_at);
  if (lastRunStr) {
    const meta = el('div', { class: 'lib-card-meta-line' });
    meta.appendChild(el('span', { class: 'k' }, [t('lib.lastRun')]));
    meta.appendChild(el('span', { class: 'v' }, [lastRunStr]));
    card.appendChild(meta);
  }

  // Actions — single primary link. The per-card "archive" button was
  // removed: it only copied a CLI command to the clipboard (since a
  // static dashboard can't mutate the registry directly), and users kept
  // treating it as "doesn't work". The `--archive` / `--unarchive` CLI
  // flags on generate_dashboard.py are still the canonical way to
  // archive, and the library filter still respects w.archived — this
  // just removes a confusing button.
  const actions = el('div', { class: 'lib-card-actions' });
  const openLink = el('a', {
    class: 'primary',
    href: 'file://' + (w.dashboard || ''),
    target: '_blank',
    rel: 'noopener',
  }, [t('lib.openDashboard')]);
  actions.appendChild(openLink);
  card.appendChild(actions);

  return card;
}

function libSparkline(points) {
  if (!points || points.length < 2) {
    // Single dot or nothing — render a flat baseline so the card height stays constant
    if (!points || points.length === 0) return null;
  }
  const w = 280, h = 36, pad = 4;
  const xs = points.length;
  const ns = `http://www.w3.org/2000/svg`;
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'lib-spark');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('preserveAspectRatio', 'none');

  const x = i => xs <= 1 ? w / 2 : pad + (w - pad * 2) * (i / (xs - 1));
  const y = pct => {
    const p = (pct ?? 0) / 100;
    return h - pad - (h - pad * 2) * p;
  };

  const coords = points.map((p, i) => [x(i), y(p.pct)]);
  const linePath = coords.map(([px, py], i) => (i === 0 ? `M ${px} ${py}` : `L ${px} ${py}`)).join(' ');
  const fillPath = `${linePath} L ${coords[coords.length - 1][0]} ${h} L ${coords[0][0]} ${h} Z`;

  const fill = document.createElementNS(ns, 'path');
  fill.setAttribute('class', 'spark-fill');
  fill.setAttribute('d', fillPath);
  svg.appendChild(fill);

  const line = document.createElementNS(ns, 'path');
  line.setAttribute('class', 'spark-line');
  line.setAttribute('d', linePath);
  svg.appendChild(line);

  coords.forEach(([cx, cy], i) => {
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('class', 'spark-dot' + (i === coords.length - 1 ? ' last' : ''));
    c.setAttribute('cx', cx);
    c.setAttribute('cy', cy);
    c.setAttribute('r', i === coords.length - 1 ? 3 : 2);
    svg.appendChild(c);
  });
  return svg;
}

/* ─── Top fixes (Step 15 Proposer output) ──────────────────
   Renders the full Proposer synthesis: editorial verdict → diagnosis row
   (root_causes) → ranked proposal cards → deferred panel. Reads
   iter.improvement_proposal (embedded by aggregate.py) and uses the shared
   buildFixIndex(iter) lookups so chips become anchor links into the per-fail
   cards rendered later in the page. Returns null if no proposal was
   generated, so the caller can skip appending the section entirely. */
function renderTopFixes(iter) {
  const prop = iter && iter.improvement_proposal;
  if (!prop) return null;
  const proposals = Array.isArray(prop.proposals) ? prop.proposals : [];
  if (proposals.length === 0) return null;

  const fixIndex = buildFixIndex(iter);
  const { nameByCheckId, rootCauseByName, totals } = fixIndex;

  const sec = el('section', { class: 'top-fixes', id: 'suggested-fixes' });

  // Section head: title + proposal count + project-context badge
  const head = el('div', { class: 'tf-head' });
  const title = el('div', { class: 'tf-title' });
  title.appendChild(iconEl('bulb'));
  title.appendChild(document.createTextNode(t('fixes.title')));
  head.appendChild(title);
  const countKey = proposals.length === 1 ? 'fixes.proposalCountOne' : 'fixes.proposalCount';
  head.appendChild(el('span', { class: 'tf-badge' },
    [t(countKey, { n: proposals.length })]));
  const ctxOn = prop.project_context_used === true;
  const ctxBadge = el('span', {
    class: 'tf-context-badge' + (ctxOn ? ' on' : '')
  }, [ctxOn ? t('fixes.contextBadge') : t('fixes.contextBadgeOff')]);
  if (!ctxOn) ctxBadge.title = t('fixes.contextBadgeOffHint');
  head.appendChild(ctxBadge);
  sec.appendChild(head);

  // Audit summary — the proposer's one-sentence headline. Required by
  // schema; the dashboard used to silently drop it. Sits prominently above
  // the diagnosis row so it's the first thing the reader sees in this section.
  if (prop.verdict) {
    const vblock = el('div', { class: 'tf-verdict-block' });
    vblock.appendChild(el('span', { class: 'tf-verdict-label' }, [t('fixes.verdictLabel')]));
    vblock.appendChild(el('div', { class: 'tf-verdict-text' }, [prop.verdict]));
    sec.appendChild(vblock);
  }

  // project_context_summary — what the proposer actually leaned on, when
  // it had project context to lean on. Surfaces the badge's substance
  // instead of leaving it as a decorative pill.
  if (ctxOn && prop.project_context_summary) {
    sec.appendChild(el('div', { class: 'tf-context-detail' },
      [prop.project_context_summary]));
  }

  // Diagnosis row — root_causes as small named-cluster cards. Required by
  // schema; this is the second silently-dropped field. Each card shows the
  // cluster name, the count of fails it explains, and the rationale.
  const rootCauses = Array.isArray(prop.root_causes) ? prop.root_causes : [];
  if (rootCauses.length > 0) {
    const dwrap = el('div', { class: 'tf-diagnosis' });
    const dhead = el('div', { class: 'tf-d-head' });
    dhead.appendChild(el('span', { class: 'tf-d-label' }, [t('fixes.diagnosis')]));
    dhead.appendChild(el('span', { class: 'tf-d-hint' }, [t('fixes.diagnosisHint')]));
    dwrap.appendChild(dhead);
    const grid = el('div', { class: 'tf-d-grid' });
    rootCauses.forEach(rc => {
      const card = el('div', {
        class: 'rootcause-card',
        id: 'rootcause-' + (rc.name || '').replace(/[^a-z0-9]+/gi, '-'),
      });
      const rhead = el('div', { class: 'rc-head' });
      const explainsCount = Array.isArray(rc.explains) ? rc.explains.length : 0;
      const countKey = explainsCount === 1
        ? 'fixes.rootCauseExplainsOne'
        : 'fixes.rootCauseExplainsMany';
      rhead.appendChild(el('span', { class: 'rc-count' },
        [t(countKey, { n: explainsCount })]));
      rhead.appendChild(el('span', { class: 'rc-name' }, [rc.name || '(unnamed)']));
      card.appendChild(rhead);
      if (rc.rationale) {
        card.appendChild(el('div', { class: 'rc-rationale' }, [rc.rationale]));
      }
      grid.appendChild(card);
    });
    dwrap.appendChild(grid);
    sec.appendChild(dwrap);
  }

  // Subtitle (existing — moved below the diagnosis so the reader hits the
  // editorial story first, then the operating instructions for the section).
  sec.appendChild(el('div', { class: 'tf-sub' }, [t('fixes.subtitle')]));

  // Accounting strip — how many fails are covered, deferred, missed.
  // Closes the loop on "is the proposer leaving stuff out?".
  if (totals.fails > 0) {
    const allCovered = totals.missing === 0;
    const acc = el('div', { class: 'tf-accounting' + (allCovered ? ' all-covered' : '') });
    if (allCovered) {
      acc.appendChild(document.createTextNode(t('fixes.accountingAllCovered')));
    } else {
      const text = t('fixes.accounting', {
        covered: totals.covered,
        deferred: totals.deferred,
        missing: totals.missing,
      });
      // Wrap the missing count visually so it stands out red. The string is
      // i18n'd so we can't span-wrap it generically — use a 2-pass split.
      const missingMarker = String(totals.missing);
      const idx = text.lastIndexOf(missingMarker);
      if (idx >= 0) {
        acc.appendChild(document.createTextNode(text.slice(0, idx)));
        const span = el('span', { class: 'ta-missing' },
          [text.slice(idx, idx + missingMarker.length)]);
        acc.appendChild(span);
        acc.appendChild(document.createTextNode(text.slice(idx + missingMarker.length)));
      } else {
        acc.appendChild(document.createTextNode(text));
      }
    }
    sec.appendChild(acc);
  }

  // Sort by rank ascending; fall back to original order when rank missing.
  const sorted = proposals.slice().sort((a, b) => {
    const ra = typeof a.rank === 'number' ? a.rank : 999;
    const rb = typeof b.rank === 'number' ? b.rank : 999;
    return ra - rb;
  });

  sorted.forEach((p, idx) => {
    const card = el('div', {
      class: 'proposal-card',
      id: safeProposalDomId(p.rank),
    });
    // Drives the staggered card-in animation in CSS via animation-delay
    card.style.setProperty('--card-index', String(idx));

    // Fix-queue checkbox (top-right, absolute positioned)
    const qkey = `proposal:${idx}:${p.title || ''}`;
    card.appendChild(queueCheckbox(qkey, {
      kind: 'proposal',
      data: p,
      label: p.title || `Fix ${idx + 1}`,
    }));

    card.appendChild(el('div', { class: 'proposal-rank' },
      [typeof p.rank === 'number' ? '#' + p.rank : '·']));

    // Title row — title text plus a "closes N fails" coverage badge so
    // the synthesis value (1 decision → N fails closed) is visible at
    // a glance instead of buried in the chip count.
    const titleRow = el('div', { class: 'proposal-title' });
    titleRow.appendChild(document.createTextNode(p.title || '(untitled)'));
    const addressesRaw = Array.isArray(p.addresses_fails) ? p.addresses_fails : [];
    if (addressesRaw.length > 0) {
      const covKey = addressesRaw.length === 1 ? 'fixes.coverageOne' : 'fixes.coverageMany';
      titleRow.appendChild(el('span', { class: 'proposal-coverage' },
        [t(covKey, { n: addressesRaw.length })]));
    }
    card.appendChild(titleRow);

    // addresses_fails — chips become anchor links jumping to the underlying
    // fail card. Chip text is the human-readable check name (joined from
    // the catalog by aggregate.py); raw check_id stays in the title attribute.
    if (addressesRaw.length > 0) {
      const row = el('div', { class: 'proposal-addresses' });
      row.appendChild(el('span', { class: 'label' }, [t('fixes.addresses')]));
      addressesRaw.forEach(raw => {
        const rawStr = String(raw);
        const isPartial = /\(partial\)/i.test(rawStr);
        const bare = stripPartialSuffix(rawStr);
        const display = nameByCheckId[bare] || bare;
        const chipText = isPartial ? `${display} (${t('fixes.partial')})` : display;
        const anchor = el('a', {
          class: 'chip' + (isPartial ? ' partial' : ''),
          href: '#' + safeFailDomId(bare),
          title: bare,
        }, [chipText]);
        anchor.addEventListener('click', (e) => flashTarget(safeFailDomId(bare), e));
        row.appendChild(anchor);
      });
      card.appendChild(row);
    }

    // summary — optional 1-sentence elaboration of the title.
    // Visible by default because it's the deliverable, not the implementation.
    if (p.summary) {
      card.appendChild(el('div', { class: 'proposal-summary' }, [p.summary]));
    }

    // why_first — visible, sits above the implementation accordion so the
    // reader sees the rank rationale before the file pointers.
    if (p.why_first) {
      const why = el('div', { class: 'proposal-section' });
      why.appendChild(el('span', { class: 'ps-label' }, [t('fixes.whyFirst')]));
      why.appendChild(document.createTextNode(p.why_first));
      card.appendChild(why);
    }

    // addresses_root_causes — link back to the diagnosis row above so the
    // proposal → root_cause connection is explicit. Visible by default —
    // it's metadata about which problem the proposal closes, not how to
    // implement it.
    const addressesRoots = Array.isArray(p.addresses_root_causes) ? p.addresses_root_causes : [];
    const validRoots = addressesRoots.filter(name => rootCauseByName[name]);
    if (validRoots.length > 0) {
      const rcRow = el('div', { class: 'proposal-rootcauses' });
      rcRow.appendChild(el('span', { class: 'label' }, [t('fixes.proposalAddressesRoot')]));
      validRoots.forEach(name => {
        const a = el('a', {
          href: '#rootcause-' + name.replace(/[^a-z0-9]+/gi, '-'),
        }, [name]);
        a.addEventListener('click', (e) => flashTarget(
          'rootcause-' + name.replace(/[^a-z0-9]+/gi, '-'), e));
        rcRow.appendChild(a);
      });
      card.appendChild(rcRow);
    }

    // concrete_steps + estimated_files inside a default-collapsed
    // accordion. The title + summary + why_first + addresses are the
    // "what to do" surface; the implementation pointers live inside the
    // foldout because most readers don't need them on first scan.
    const steps = Array.isArray(p.concrete_steps) ? p.concrete_steps : [];
    const files = Array.isArray(p.estimated_files) ? p.estimated_files : [];
    if (steps.length > 0 || files.length > 0) {
      const det = document.createElement('details');
      det.className = 'proposal-impl';
      const sum = document.createElement('summary');
      const chev = document.createElement('span');
      chev.className = 'chev icon';
      chev.innerHTML = svgIcon('chevronR');
      sum.appendChild(chev);
      sum.appendChild(document.createTextNode(t('fixes.howToImplement')));
      // small badge with step count so the reader knows the foldout has
      // content without expanding it
      const badge = el('span', { class: 'pi-badge' }, [
        steps.length === 1
          ? t('fixes.stepCountOne', { n: steps.length })
          : t('fixes.stepCountMany', { n: steps.length }),
      ]);
      sum.appendChild(badge);
      det.appendChild(sum);
      const body = el('div', { class: 'proposal-impl-body' });

      if (steps.length > 0) {
        const sect = el('div', { class: 'proposal-section' });
        sect.appendChild(el('span', { class: 'ps-label' }, [t('fixes.steps')]));
        const ol = el('ol', { class: 'proposal-steps' });
        steps.forEach(s => ol.appendChild(el('li', null, [s])));
        sect.appendChild(ol);
        body.appendChild(sect);
      }
      if (files.length > 0) {
        const fwrap = el('div', { class: 'proposal-section' });
        fwrap.appendChild(el('span', { class: 'ps-label' }, [t('fixes.estimatedFiles')]));
        const fbox = el('div', { class: 'proposal-files' });
        files.forEach(f => fbox.appendChild(el('span', { class: 'fchip' }, [f])));
        fwrap.appendChild(fbox);
        body.appendChild(fwrap);
      }
      det.appendChild(body);
      card.appendChild(det);
    }

    sec.appendChild(card);
  });

  // Deferred — small secondary panel. Each entry shows the human-readable
  // name (joined from the catalog) instead of the raw check_id slug.
  const deferred = Array.isArray(prop.deferred) ? prop.deferred : [];
  if (deferred.length > 0) {
    const dwrap = el('div', { class: 'tf-deferred' });
    dwrap.appendChild(el('div', { class: 'tf-d-head' }, [t('fixes.deferred')]));
    dwrap.appendChild(el('div', { class: 'tf-d-sub' }, [t('fixes.deferredBody')]));
    const ul = el('ul');
    deferred.forEach(d => {
      const cid = (d && d.check_id) ? d.check_id : '?';
      const display = nameByCheckId[cid] || cid;
      const reason = (d && d.reason) ? ' — ' + d.reason : '';
      const li = el('li');
      const a = el('a', { href: '#' + safeFailDomId(cid), title: cid }, [display]);
      a.addEventListener('click', (e) => flashTarget(safeFailDomId(cid), e));
      li.appendChild(a);
      li.appendChild(document.createTextNode(reason));
      ul.appendChild(li);
    });
    dwrap.appendChild(ul);
    sec.appendChild(dwrap);
  }

  return sec;
}

/* Smooth-scroll + flash highlight when a proposal chip / deferred link is
   clicked. The default browser anchor jump is fine but a brief outline
   flash makes it obvious where the user landed when the target is below
   the fold or when the user clicks a chip whose target was already on
   screen. Falls back silently if the target is missing. */
function flashTarget(domId, ev) {
  if (!domId) return;
  const node = document.getElementById(domId);
  if (!node) return;
  // Let the browser handle the default anchor scroll, then add the flash class.
  setTimeout(() => {
    node.classList.add('target-flash');
    setTimeout(() => node.classList.remove('target-flash'), 1500);
  }, 50);
}

/* ─── SINGLE / AUDIT mode ───────────────────────────────── */
function renderSingle(root) {
  const app = (DATA.apps || [])[currentAppIdx] || (DATA.apps || [])[0];
  if (!app) { root.appendChild(el('p', null, [t('noData')])); return; }
  const iter = app.iterations[currentIterIdx] || app.iterations[app.iterations.length - 1];
  renderAuditBody(root, app, iter);
}

function renderAuditBody(root, app, iter) {
  // Pin the iteration's shared target screenshot so L3-vision cards can
  // fall back to it via effectiveEmbeddedFiles(). Set before any render
  // helper runs so both fail and pass L3 cards pick it up.
  currentTargetScreenshot = iter.screenshot_data_uri || null;
  // Build the proposal/fail cross-reference index ONCE per render so all
  // sub-renderers (renderTopFixes, renderFailCard, …) share the same view
  // of which fails are covered by which proposals. The result is also
  // cached on iter._fixIndex so re-renders during the same iteration are
  // free.
  const fixIndex = buildFixIndex(iter);
  const summary = iter.summary || {};
  const checks = iter.checks || [];
  const total = summary.total || 0;
  const passed = summary.passed || 0;
  const failed = summary.failed || 0;
  const skipped = summary.skipped || 0;
  const unverifiable = summary.unverifiable || 0;
  const passRate = summary.pass_rate;
  const passPct = passRate != null ? Math.round(passRate * 100) : 0;
  const bandStats = computeBandStats(checks);
  const uxStats = bandStats['ux'] || { total: 0, passed: 0, failed: 0, skipped: 0, unverifiable: 0 };
  const uiRiskStats = bandStats['ui-risk'] || { total: 0, passed: 0, failed: 0, skipped: 0, unverifiable: 0 };
  // applicable denominator excludes BOTH skipped and unverifiable: skipped
  // = check didn't run, unverifiable = check ran but couldn't commit (capture
  // incomplete). Neither tells us anything about the app, so neither should
  // bring the pass-rate down.
  const uxApplicable = Math.max(0, uxStats.total - uxStats.skipped - (uxStats.unverifiable || 0));
  const uxPct = uxApplicable > 0 ? Math.round((uxStats.passed / uxApplicable) * 100) : passPct;
  const statusWord = uxPct >= 90 ? t('verdict.excellent')
    : uxPct >= 70 ? t('verdict.solid')
    : uxPct >= 40 ? t('verdict.needsWork')
    : t('verdict.critical');
  const uiRiskFails = uiRiskStats.failed || 0;

  // ─── L1: VERDICT (the answer at a glance) ──────────────
  const verdict = el('section', { class: 'verdict' });
  const vleft = el('div');
  const vmeta = el('div', { class: 'v-meta' });
  const appHref = safeHttpHref(app.url);
  if (appHref) {
    const a = el('a', { href: appHref, target: '_blank', rel: 'noopener noreferrer' });
    const icon = iconEl('link');
    const svg = icon.querySelector('svg');
    if (svg) {
      svg.setAttribute('width', 11);
      svg.setAttribute('height', 11);
    }
    a.appendChild(icon);
    a.appendChild(el('span', null, [appHref]));
    vmeta.appendChild(a);
  }
  const dateStr = fmtDate(iter.generated_at);
  if (dateStr) {
    vmeta.appendChild(el('span', { class: 'dot' }));
    vmeta.appendChild(el('span', null, [dateStr]));
  }
  vmeta.appendChild(el('span', { class: 'dot' }));
  vmeta.appendChild(el('span', null, [iter.label || ('iteration ' + iter.iteration)]));
  const vpb = viewportBadge(iter.viewport, iter.target_kind);
  if (vpb) {
    vmeta.appendChild(el('span', { class: 'dot' }));
    vmeta.appendChild(vpb);
  }
  vleft.appendChild(vmeta);
  vleft.appendChild(el('h1', null, [app.name || 'untitled']));
  const statusEl = el('div', { class: 'v-status ' + rateClass(uxPct) });
  statusEl.appendChild(el('span', { class: 'v-dot' }));
  statusEl.appendChild(document.createTextNode(
    statusWord + ' · ' + t('verdict.statusLine', {
      passed: uxStats.passed,
      applicable: uxApplicable,
      uiRiskFails,
      skipped,
    })
  ));
  vleft.appendChild(statusEl);
  const substats = el('div', { class: 'v-substats' });
  substats.appendChild(el('span', { class: 'chip' }, [
    el('strong', null, [t('verdict.passRate')]),
    `${uxPct}%`,
  ]));
  substats.appendChild(el('span', { class: 'chip' }, [
    el('strong', null, [t('verdict.overallRate')]),
    `${passPct}%`,
  ]));
  const scenarioSummary = scenarioComparabilitySummary(iter);
  if (scenarioSummary) {
    substats.appendChild(el('span', { class: 'chip' }, [scenarioSummary]));
  }
  vleft.appendChild(substats);
  verdict.appendChild(vleft);

  // Hero action: "X things to fix" / "all clear". Prefer proposer proposal
  // count when present (synthesized, root-cause clustered) — falls back to
  // raw fail count otherwise. Click jumps to #suggested-fixes if proposer
  // ran, else to #all-issues so the user always lands on something
  // actionable.
  const proposalCount = (iter.improvement_proposal && Array.isArray(iter.improvement_proposal.proposals))
    ? iter.improvement_proposal.proposals.length
    : 0;
  const actionCount = proposalCount > 0 ? proposalCount : failed;
  const jumpHref = proposalCount > 0 ? '#suggested-fixes' : '#all-issues';
  const vAction = el('a', { class: 'v-action', href: jumpHref });
  if (actionCount === 0) {
    const num = el('div', { class: 'va-num allclear' });
    num.innerHTML = `<span class="va-icon">${svgIcon('check')}</span>`;
    vAction.appendChild(num);
    vAction.appendChild(el('div', { class: 'va-label' }, [t('verdict.allClear')]));
    vAction.setAttribute('aria-label', t('verdict.allClear'));
  } else {
    vAction.appendChild(el('div', { class: 'va-num fix' }, [String(actionCount)]));
    const labelText = actionCount === 1 ? t('verdict.thingsToFixOne') : t('verdict.thingsToFixMany');
    const label = el('div', { class: 'va-label' });
    label.appendChild(document.createTextNode(labelText));
    const arrow = el('span', { class: 'va-arrow' });
    arrow.innerHTML = svgIcon('arrowR');
    label.appendChild(arrow);
    vAction.appendChild(label);
    vAction.appendChild(el('div', { class: 'va-hint' }, [t('verdict.jumpHint')]));
    vAction.setAttribute('aria-label', `${actionCount} ${labelText} — ${t('verdict.jumpHint')}`);
  }
  verdict.appendChild(vAction);
  root.appendChild(verdict);

  // ─── audit-layout: 2-col grid (main + sticky aside) ───
  // Everything from the band-row onward lives in mainCol; the captured
  // target screenshot lives in the sticky aside on the right. At narrow
  // widths the layout collapses to a single column (CSS @media).
  const layout = el('div', { class: 'audit-layout' });
  const mainCol = el('div', { class: 'audit-main' });
  const aside = el('aside', { class: 'audit-aside' });
  layout.appendChild(mainCol);
  layout.appendChild(aside);
  root.appendChild(layout);

  // ─── L1.5: BAND BREAKDOWN (UX / UI Risk) ───────────────
  const brow = el('section', { class: 'band-row' });
  const uiRiskApplicable = Math.max(0, uiRiskStats.total - uiRiskStats.skipped);
  const uiRiskPct = uiRiskApplicable > 0
    ? Math.max(0, 100 - Math.round((uiRiskFails / uiRiskApplicable) * 100))
    : 100;
  [
    {
      key: 'ux',
      icon: 'layers',
      shortKey: 'band.ux.short',
      longKey: 'band.ux.long',
      stats: uxStats,
      pct: uxPct,
      statText: t('band.passingOf', { passed: uxStats.passed, total: uxApplicable || 0 }),
    },
    {
      key: 'ui-risk',
      icon: 'alert',
      shortKey: 'band.ui-risk.short',
      longKey: 'band.ui-risk.long',
      stats: uiRiskStats,
      pct: uiRiskPct,
      statText: t('band.risksFlagged', { n: uiRiskFails }),
    },
  ].forEach(b => {
    const bc = el('div', { class: 'bcard' });
    const tag = el('div', { class: 'bcard-tag' });
    tag.appendChild(iconEl(b.icon));
    tag.appendChild(document.createTextNode(t(b.shortKey)));
    bc.appendChild(tag);
    bc.appendChild(el('div', { class: 'bcard-name' }, [t(b.shortKey)]));
    bc.appendChild(el('div', { class: 'bcard-desc' }, [t(b.longKey)]));
    const bar = el('div', { class: 'bcard-bar' });
    const fill = el('div', { class: `bcard-fill ${rateClass(b.pct ?? 0)}` });
    fill.style.width = (b.pct ?? 0) + '%';
    bar.appendChild(fill);
    bc.appendChild(bar);
    const stats = el('div', { class: 'bcard-stats' });
    stats.appendChild(el('span', null, [b.statText]));
    stats.appendChild(el('span', { class: `bcard-rate ${rateClass(b.pct ?? 0)}` }, [b.pct == null ? '—' : b.pct + '%']));
    bc.appendChild(stats);
    brow.appendChild(bc);
  });
  mainCol.appendChild(brow);

  // ─── PRIMARY: SUGGESTED FIXES (Proposer synthesis — ranked) ──
  // Only renders if aggregate.py embedded an improvement_proposal for this
  // iteration. When present, it is the canonical "what to do next" view —
  // the raw failure list below is demoted to a collapsed secondary view.
  const fixes = renderTopFixes(iter);
  if (fixes) mainCol.appendChild(fixes);

  // ─── SECONDARY: ALL ISSUES (raw failures, collapsed by default) ──
  // Wrapped in <details class="all-issues">. When the Proposer ran, this
  // is collapsed by default (the user should trust the synthesized view).
  // When there is no Proposer output, it expands by default — otherwise
  // the user would land on an empty page.
  const failures = checks.filter(c => c.result === 'fail' || c.result === 'error');
  if (failures.length > 0) {
    const uxFailures = failures.filter(c => logicalBand(c) === 'ux');
    const riskFailures = failures.filter(c => logicalBand(c) === 'ui-risk');

    const allDet = document.createElement('details');
    allDet.className = 'all-issues';
    allDet.id = 'all-issues';
    if (!fixes) allDet.open = true;
    const allSum = document.createElement('summary');
    const allChev = document.createElement('span');
    allChev.className = 'chev icon';
    allChev.innerHTML = svgIcon('chevronR');
    allSum.appendChild(allChev);
    allSum.appendChild(el('span', { class: 'ai-label' }, [t('action.allIssues')]));
    allSum.appendChild(el('span', { class: 'ai-count' }, [String(failures.length)]));
    allSum.appendChild(el('span', { class: 'ai-hint' }, [t('action.allIssuesHint')]));
    allDet.appendChild(allSum);
    const allBody = el('div', { class: 'ai-body' });

    if (uxFailures.length > 0) {
      const sec = el('section', { class: 'action-section' });
      const head = el('div', { class: 'section-head action' });
      head.appendChild(iconEl('alert'));
      head.appendChild(document.createTextNode(t('action.ux')));
      const issuesText = uxFailures.length === 1 ? t('action.issuesOne') : t('action.issuesMany', { n: uxFailures.length });
      head.appendChild(el('span', { class: 'badge' }, [issuesText]));
      head.appendChild(el('span', { class: 'head-tag' }, [t('action.groupedBySubtype')]));
      sec.appendChild(head);

      const subtypeOrder = UX_SUBTYPE_ORDER;
      const groups = groupUxFailuresBySubtype(uxFailures);
      subtypeOrder.forEach(st => {
        const items = groups[st.key] || [];
